services:
  namu-cloud-routing:
    # 이미지는 deploy.yml이 clone --recurse-submodules 후 로컬 빌드로 생성한다.
    # 개인용 namu(#tag 원URL 빌드)와 달리 서브모듈 vendor/namu-agent가 필요해
    # '#tag' 컨텍스트로는 서브모듈이 누락된다 — 로컬 빌드 방식이 강제된다.
    image: namu-cloud-routing:v0.1.2
    container_name: namu-cloud-routing
    ports:
      - "8770:8770"
    restart: always
    environment:
      # 시작 시 entrypoint가 이 remote로 namu-cloud-memory를 clone/pull한다.
      - NAMU_STORE_REMOTE=${NAMU_STORE_REMOTE}
      # STORE clone 경로 = 사용자 디렉토리(users/<키>/)의 부모. 볼륨에 영속화.
      - NAMU_STORE_ROOT=/root/.namu-store
      # 헤더 인증 토큰(x-api-key / Bearer). repo에선 NAMU_CLOUD_HTTP_TOKEN으로
      # 받아 컨테이너엔 표준 NAMU_HTTP_TOKEN으로 넘긴다(개인용 namu와 혼동 방지).
      - NAMU_HTTP_TOKEN=${NAMU_CLOUD_HTTP_TOKEN}
      # 터널 경유 Host 헤더 허용(미설정 시 421 Misdirected Request로 거부됨).
      - NAMU_HTTP_ALLOWED_HOSTS=namu-cloud.onnamu.kr
    volumes:
      - namu_cloud_store:/root/.namu-store

volumes:
  namu_cloud_store:
