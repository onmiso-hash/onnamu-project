services:
  namu-cloud-routing:
    # 이미지는 deploy.yml이 clone --recurse-submodules 후 로컬 빌드로 생성한다.
    # 개인용 namu(#tag 원URL 빌드)와 달리 서브모듈 vendor/namu-agent가 필요해
    # '#tag' 컨텍스트로는 서브모듈이 누락된다 — 로컬 빌드 방식이 강제된다.
    image: namu-cloud-routing:v0.1.60
    container_name: namu-cloud-routing
    ports:
      - "8770:8770"
    restart: always
    environment:
      # 사용자별 저장소 사본이 쌓이는 볼륨 폴더(users/<키>/). git 작업 트리가 아니다
      # — v0.1.7부터 나무 소유 STORE 저장소는 폐기됐고(NAMU_STORE_REMOTE도 제거),
      # 기억의 원본은 각 사용자 본인의 GitHub repo다.
      - NAMU_STORE_ROOT=/root/.namu-store
      # URL 경로 시크릿(/mcp/<secret>). claude.ai 웹 커넥터는 임의 헤더를 못 넣어
      # 개인용 namu처럼 시크릿을 URL 경로에 실어 인증한다(헤더 불필요). repo에선
      # NAMU_CLOUD_PATH_SECRET으로 받아 컨테이너엔 표준 NAMU_HTTP_PATH_SECRET로 넘긴다.
      - NAMU_HTTP_PATH_SECRET=${NAMU_CLOUD_PATH_SECRET}
      # 터널 경유 Host 헤더 허용(미설정 시 421 Misdirected Request로 거부됨).
      - NAMU_HTTP_ALLOWED_HOSTS=namu-cloud.onnamu.kr
      # --- 신원 계층(v0.1.7, namu-58) ---------------------------------------
      # 아래 5종은 .env에 값이 있어도 이 블록에 적지 않으면 컨테이너에 들어가지
      # 않는다(compose는 .env를 ${} 치환에만 쓴다). 누락 시 /auth/github/login이
      # RuntimeError로 500을 낸다 — 실측으로 확인된 갭이라 여기 명시한다.
      - NAMU_GITHUB_APP_ID=${NAMU_GITHUB_APP_ID}
      - NAMU_GITHUB_CLIENT_ID=${NAMU_GITHUB_CLIENT_ID}
      - NAMU_GITHUB_CLIENT_SECRET=${NAMU_GITHUB_CLIENT_SECRET}
      # 개인키 .pem 전체를 base64 한 줄로 접어 넣는다(.env가 여러 줄 값을 못 담음).
      #   base64 -w0 namu-memory-app.private-key.pem
      - NAMU_GITHUB_APP_PRIVATE_KEY=${NAMU_GITHUB_APP_PRIVATE_KEY}
      # 쿠키(state/session)·select-repo 링크 서명 키. NAMU_CLOUD_PATH_SECRET과
      # 다른 값이어야 한다(수명 주기가 달라 하나를 교체하면 다른 하나가 함께 끊긴다).
      - NAMU_SESSION_SECRET=${NAMU_SESSION_SECRET}
      # 가입자 장부(user_key ↔ github_id ↔ 설치/repo). NAMU_STORE_ROOT **바깥**의
      # 전용 볼륨에 둔다 — 안쪽에 두면 사용자 저장소로 push될 때 가입자 명단이
      # 함께 커밋된다. 별도 볼륨이라 재배포에도 살아남는다(컨테이너 FS면 매 배포
      # 마다 모든 사용자의 연결이 사라진다).
      - NAMU_IDENTITY_DB_PATH=/root/.namu-identity/identity.db
      # --- AI 안내원(v0.1.39, namu-ai-guide) ---------------------------------
      # 홈페이지 오른쪽 아래 말풍선. **열쇠가 없으면 단추를 아예 안 그린다** —
      # 세 줄이 비어 있어도 홈페이지는 종전과 똑같이 뜬다(설계서 11절).
      # 열쇠는 저장소에 적지 않는다. GitHub 금고(Secrets)의 NAMU_ASK_API_KEY를
      # deploy.yml이 배포 때마다 namu-cloud/.env 끝에 붙이고, 아래 줄이 그것을
      # 컨테이너로 넘긴다. 이름에 회사가 들어가지 않는 이유는 회사·모델과 함께
      # 갈아 끼우는 값이기 때문이다(설계서 6-3절).
      - NAMU_ASK_API_KEY=${NAMU_ASK_API_KEY}
      # 회사와 모델. 갈아 끼울 때 고치는 자리가 여기다 — 코드는 안 고친다.
      - NAMU_ASK_PROVIDER=gemini
      - NAMU_ASK_MODEL=gemini-3.5-flash-lite
    volumes:
      # 접속 기록 보관함 — 포털·도메인 조회·스튜디오·나무 클라우드 네 곳이 같은
      # 폴더에 쌓고, 관리자 화면(접속자 지도)이 이 폴더를 읽는다. 이름 있는
      # 볼륨이 아니라 **미니PC의 실제 폴더**여야 한다 — 네 컨테이너가 같은 폴더를
      # 봐야 지도가 한 장으로 모이기 때문이다. 이 줄이 없으면 클라우드의 기록은
      # 컨테이너 안에만 쌓이고 지도에 한 점도 안 찍히는데, 기록은 곁다리라
      # 조용히 넘어가므로 오류도 안 난다.
      - "C:/Users/onmis/project/traffic:/traffic"
      - namu_cloud_store:/root/.namu-store
      - namu_cloud_identity:/root/.namu-identity

volumes:
  namu_cloud_store:
  namu_cloud_identity:
