<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 영화관 - Media Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* 공통 스타일 및 Glassmorphism 레이아웃 (gallery.html과 통일) */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
            color: #f1f5f9;
        }
        
        /* ── 헤더 (gallery.html과 통일) ── */
        header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .logo { font-size: 20px; font-weight: 700; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .user-badge {
            background-color: rgba(168, 85, 247, 0.15);
            color: #a855f7;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid rgba(168, 85, 247, 0.2);
        }
        
        .header-right { display: flex; align-items: center; gap: 10px; }
        .header-btn {
            font-size: 12px; color: #94a3b8; text-decoration: none;
            padding: 8px 18px; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px;
            transition: all 0.3s ease; background-color: rgba(255, 255, 255, 0.03);
            font-weight: 600;
        }
        .header-btn:hover { color: #fff; border-color: rgba(255, 255, 255, 0.2); background-color: rgba(255, 255, 255, 0.08); }
        .header-btn.active { color: white; background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%); box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3); border: none; }

        /* ── 메인 콘텐츠 ── */
        main { padding: 40px 30px; max-width: 1800px; margin: 0 auto; animation: fadeInUp 0.5s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .page-header { margin-bottom: 40px; padding: 0 10px; text-align: center; }
        .page-title { font-size: 32px; font-weight: 700; color: #fff; margin-bottom: 12px; letter-spacing: -1px; }
        .page-subtitle { font-size: 16px; color: #94a3b8; }

        /* ── 영화 그리드 (Glassmorphism 카드) ── */
        .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 30px; }
        
        .movie-card {
            position: relative; border-radius: 24px; overflow: hidden;
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer; transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            display: flex; flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .movie-card:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0,0,0,0.4); border-color: #a855f7; }

        .movie-poster-area { position: relative; width: 100%; aspect-ratio: 16/9; overflow: hidden; background: #000; }
        .movie-poster-area video { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; filter: brightness(0.8); }
        .movie-card:hover .movie-poster-area video { transform: scale(1.08); filter: brightness(1); }

        .play-overlay {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.3s; background: rgba(0,0,0,0.3); backdrop-filter: blur(4px);
        }
        .play-overlay svg { width: 70px; height: 70px; filter: drop-shadow(0 4px 15px rgba(0,0,0,0.5)); color: #fff; }
        .movie-card:hover .play-overlay { opacity: 1; }

        .movie-info {
            padding: 24px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between;
            background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(10px);
        }
        .movie-title { font-size: 19px; font-weight: 700; color: #fff; margin-bottom: 14px; line-height: 1.4; }
        .movie-meta { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #64748b; border-top: 1px solid rgba(255, 255, 255, 0.05); padding-top: 16px; }
        
        .folder-badge {
            background-color: rgba(168, 85, 247, 0.1); color: #a855f7;
            padding: 4px 12px; border-radius: 8px; font-size: 11px; font-weight: 700;
            border: 1px solid rgba(168, 85, 247, 0.2);
        }

        .empty { text-align: center; padding: 120px 20px; color: #64748b; grid-column: 1 / -1; background: rgba(255,255,255,0.02); border-radius: 24px; border: 1px dashed rgba(255,255,255,0.1); }

        @media (max-width: 900px) {
            header { height: auto; padding: 20px; flex-direction: column; gap: 15px; }
            .header-right { width: 100%; justify-content: center; flex-wrap: wrap; }
            .page-title { font-size: 26px; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <a class="logo" href="/">🏠 Media Home</a>
        <span class="user-badge">{{ username }}</span>
    </div>
    <div class="header-right">
        <a href="/" class="header-btn">📹 일반 갤러리</a>
        <a href="/movies" class="header-btn active">🎬 영화관</a>
        {% if is_admin %}
        <a href="/upload" class="header-btn">📤 업로드</a>
        <a href="/manage" class="header-btn">⚙️ 관리</a>
        {% endif %}
        <a href="/logout" class="header-btn" style="color:#f87171; border-color: rgba(248, 113, 113, 0.2);">로그아웃</a>
    </div>
</header>

<main>
    <div class="page-header">
        <h1 class="page-title">🎬 Movie Theater</h1>
        <p class="page-subtitle">고화질 미디어 스트리밍 서비스</p>
    </div>

    <div class="movies-grid">
        {% for movie in movies %}
        <div class="movie-card" onclick="location.href='/player/{{ movie.folder }}/{{ movie.name }}'">
            <div class="movie-poster-area">
                <video data-src="/media/{{ movie.path }}#t=10" muted playsinline preload="none"></video>
                <div class="play-overlay">
                    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="24" cy="24" r="24" fill="rgba(255,255,255,0.2)"/>
                        <polygon points="19,15 36,24 19,33" fill="white"/>
                    </svg>
                </div>
            </div>
            <div class="movie-info">
                <div class="movie-title">{{ movie.stem }}</div>
                <div class="movie-meta">
                    <span class="folder-badge">{{ movie.folder }}</span>
                    <span>{{ format_size(movie.size) }}</span>
                </div>
            </div>
        </div>
        {% else %}
        <div class="empty">
            <p>등록된 영화가 없습니다.</p>
        </div>
        {% endfor %}
    </div>
</main>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // 지연 로딩 (Lazy Loading) 적용
        const lazyVideos = document.querySelectorAll('.movie-poster-area video[data-src]');
        
        if ("IntersectionObserver" in window) {
            const videoObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const video = entry.target;
                        video.src = video.dataset.src;
                        video.load(); // 메타데이터 로드 시작
                        video.removeAttribute("data-src");
                        observer.unobserve(video);
                    }
                });
            }, { rootMargin: "0px 0px 200px 0px", threshold: 0.1 });

            lazyVideos.forEach(video => videoObserver.observe(video));
        } else {
            // Observer 미지원 브라우저 대응
            lazyVideos.forEach(video => {
                video.src = video.dataset.src;
                video.load();
            });
        }

        // 호버 시 미리보기 재생 유지
        document.querySelectorAll('.movie-poster-area video').forEach(video => {
            video.addEventListener('mouseenter', () => { video.play().catch(e => {}); });
            video.addEventListener('mouseleave', () => { video.pause(); video.currentTime = 10; });
        });
    });
</script>

</body>
</html>
