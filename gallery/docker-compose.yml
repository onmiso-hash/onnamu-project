services:
  my-gallery:
    build: .
    container_name: my-gallery
    restart: unless-stopped
    ports:
      - "5002:5002"
    volumes:
      # 읽기 전용 미디어 폴더들
      - C:/Users/onmis/media/public:/media/public:ro
      - C:/Users/onmis/media/private:/media/private:ro
      - C:/Users/onmis/media/family:/media/family:ro
      
      # 쓰기 가능 경로 (업로드용)
      - C:/Users/onmis/media/public/videos:/media/public/videos:rw
      - C:/Users/onmis/media/public/images:/media/public/images:rw
      - C:/Users/onmis/media/public/movies:/media/public/movies:rw
      - C:/Users/onmis/media/private/videos:/media/private/videos:rw
      - C:/Users/onmis/media/private/images:/media/private/images:rw
      - C:/Users/onmis/media/private/movies:/media/private/movies:rw
      - C:/Users/onmis/media/family/videos:/media/family/videos:rw
      - C:/Users/onmis/media/family/images:/media/family/images:rw
      - C:/Users/onmis/media/family/movies:/media/family/movies:rw

      # 썸네일 캐시 — 재배포로 컨테이너를 새로 만들어도 남아야 한다.
      # (컨테이너 내부에 두면 배포할 때마다 전부 지워져 ffmpeg을 처음부터 다시 돌린다)
      - gallery_thumbnails:/app/.thumbnails

    environment:
      - SECRET_KEY=${SECRET_KEY}
      - MEDIA_ROOT=/media
      # 영상 직행 통로 (stream.onnamu.kr).
      # 값이 비면 배포를 막는다(:?). 예전에는 비어도 조용히 넘어가 /media 느린
      # 길로 내려앉았는데, 그때 열린 재생 화면이 느린 주소를 담은 채 폰에
      # 30일 얼어붙어 값이 되돌아와도 낫지 않았다(2026-08-20 사고).
      # 통로를 정말 안 쓸 거면 이 두 줄을 지울 것 — 빈 값으로 두지 말 것.
      - STREAM_BASE_URL=${STREAM_BASE_URL:?gallery/.env 에 STREAM_BASE_URL 이 없습니다 - 영상 직행 통로 없이 배포하면 재생이 느려집니다}
      - STREAM_SECRET=${STREAM_SECRET:?gallery/.env 에 STREAM_SECRET 이 없습니다 - 영상 직행 통로 없이 배포하면 재생이 느려집니다}
      - STREAM_TTL=${STREAM_TTL:-43200}


    networks:
      - gallery-network

networks:
  gallery-network:
    driver: bridge

volumes:
  gallery_thumbnails: