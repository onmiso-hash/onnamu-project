services:
  namu:
    # 이미지는 scripts/deploy.ps1이 GitHub 참조 빌드로 생성 (compose의 Windows git URL 컨텍스트 버그 우회)
    image: namu-remote-mcp:v0.1.70
    container_name: namu-remote-mcp
    ports:
      - "8765:8765"
    restart: always
    environment:
      - NAMU_SYNC_REMOTE=${NAMU_SYNC_REMOTE}
      - NAMU_HTTP_PATH_SECRET=${NAMU_HTTP_PATH_SECRET}
      - NAMU_HTTP_ALLOWED_HOSTS=namu.onnamu.kr
    volumes:
      - namu_data:/root/.namu

volumes:
  namu_data:
