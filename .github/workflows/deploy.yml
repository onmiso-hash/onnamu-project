name: Deploy to Mini PC

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          command_timeout: 30m
          script: |
            powershell -Command "[Console]::OutputEncoding = [System.Text.Encoding]::UTF8; $OutputEncoding = [System.Text.Encoding]::UTF8; $logPath = 'C:\Users\onmis\project\deploy.log'; $ErrorActionPreference = 'Continue'; $env:DOCKER_HOST = 'npipe:////./pipe/docker_engine'; cd C:\Users\onmis\project; echo '--- Git Fetch & Reset ---' 2>&1 > $logPath; try { git fetch origin main 2>&1 >> $logPath; git reset --hard origin/main 2>&1 >> $logPath } catch { echo 'Git reset failed' 2>&1 >> $logPath }; echo '--- Docker Config Clear (All Profiles with Dummy Auth) ---' 2>&1 >> $logPath; $configPaths = @('C:\Users\onmis\.docker\config.json', ($env:USERPROFILE + '\.docker\config.json'), 'C:\Windows\System32\config\systemprofile\.docker\config.json', 'C:\Windows\SysWOW64\config\systemprofile\.docker\config.json'); foreach ($cfgPath in $configPaths) { echo ('Checking: ' + $cfgPath) 2>&1 >> $logPath; $cfgDir = [System.IO.Path]::GetDirectoryName($cfgPath); if (-not (Test-Path $cfgDir)) { try { New-Item -ItemType Directory -Path $cfgDir -Force 2>&1 >> $logPath } catch {} }; try { [System.IO.File]::WriteAllText($cfgPath, ([char]123 + [char]34 + 'credsStore' + [char]34 + ':' + [char]34 + [char]34 + ',' + [char]34 + 'auths' + [char]34 + ':' + [char]123 + [char]34 + 'https://index.docker.io/v1/' + [char]34 + ':' + [char]123 + [char]125 + [char]125 + [char]125)); echo ('Cleared & Injected Dummy Auth: ' + $cfgPath) 2>&1 >> $logPath } catch { echo ('Failed to write: ' + $cfgPath) 2>&1 >> $logPath } }; echo '--- Copy Environment ---' 2>&1 >> $logPath; if (Test-Path C:\Users\onmis\project\gallery\.env) { Copy-Item C:\Users\onmis\project\gallery\.env C:\Users\onmis\project\studio\.env -Force 2>&1 >> $logPath; Copy-Item C:\Users\onmis\project\gallery\.env C:\Users\onmis\project\portal\.env -Force 2>&1 >> $logPath; Copy-Item C:\Users\onmis\project\gallery\.env C:\Users\onmis\project\namu\.env -Force 2>&1 >> $logPath; Copy-Item C:\Users\onmis\project\gallery\.env C:\Users\onmis\project\namu-cloud\.env -Force 2>&1 >> $logPath }; $askKey = '${{ secrets.NAMU_ASK_API_KEY }}'; if ($askKey -ne '') { [System.IO.File]::AppendAllText('C:\Users\onmis\project\namu-cloud\.env', [System.Environment]::NewLine + 'NAMU_ASK_API_KEY=' + $askKey + [System.Environment]::NewLine); echo 'AI guide key: appended to namu-cloud .env' 2>&1 >> $logPath } else { echo 'AI guide key: not set (bubble stays hidden)' 2>&1 >> $logPath }; echo '--- Setup Temp Docker Config ---' 2>&1 >> $logPath; New-Item -ItemType Directory -Force -Path C:\Users\onmis\project\temp_docker_config 2>&1 >> $logPath; $env:DOCKER_CONFIG='C:\Users\onmis\project\temp_docker_config'; [System.IO.File]::WriteAllText('C:\Users\onmis\project\temp_docker_config\config.json', ([char]123 + [char]34 + 'credsStore' + [char]34 + ':' + [char]34 + [char]34 + ',' + [char]34 + 'auths' + [char]34 + ':' + [char]123 + [char]34 + 'https://index.docker.io/v1/' + [char]34 + ':' + [char]123 + [char]125 + [char]125 + [char]125)); function Cleanup-Images($imgName) { try { $keepTag = (docker inspect -f '{{.Config.Image}}' $imgName 2>$null); if ($keepTag) { $keepTag = $keepTag.Trim(); $keepId = (docker images $keepTag --format '{{.ID}}' | Select-Object -First 1); echo ('Keep: ' + $keepTag + ' [' + $keepId + ']') 2>&1 >> $logPath; if ($keepId) { docker images $imgName --format '{{.ID}}' | Select-Object -Unique | Where-Object { $_ -ne $keepId } | ForEach-Object { echo ('Removing old image: ' + $_) 2>&1 >> $logPath; docker --config C:\Users\onmis\project\temp_docker_config rmi $_ 2>&1 >> $logPath } } } else { echo ('Skip cleanup: ' + $imgName + ' container not found') 2>&1 >> $logPath } } catch { echo ('Image cleanup failed: ' + $imgName) 2>&1 >> $logPath } }; echo '--- Deploy Gallery ---' 2>&1 >> $logPath; try { cd C:\Users\onmis\project\gallery; docker --config C:\Users\onmis\project\temp_docker_config compose up -d --build 2>&1 >> $logPath } catch { echo 'Gallery deploy failed' 2>&1 >> $logPath }; echo '--- Deploy Portal ---' 2>&1 >> $logPath; try { cd C:\Users\onmis\project\portal; docker --config C:\Users\onmis\project\temp_docker_config compose up -d --build 2>&1 >> $logPath } catch { echo 'Portal deploy failed' 2>&1 >> $logPath }; echo '--- Deploy Games ---' 2>&1 >> $logPath; try { cd C:\Users\onmis\project\games; docker --config C:\Users\onmis\project\temp_docker_config compose up -d --build 2>&1 >> $logPath } catch { echo 'Games deploy failed' 2>&1 >> $logPath }; echo '--- Deploy RDAP ---' 2>&1 >> $logPath; try { cd C:\Users\onmis\project\rdap; docker --config C:\Users\onmis\project\temp_docker_config compose down 2>&1 >> $logPath; docker --config C:\Users\onmis\project\temp_docker_config compose up -d --build 2>&1 >> $logPath } catch { echo 'RDAP deploy failed' 2>&1 >> $logPath }; echo '--- Deploy NAMU ---' 2>&1 >> $logPath; try { docker --config C:\Users\onmis\project\temp_docker_config build -f deploy/Dockerfile -t namu-remote-mcp:v0.1.68 'https://github.com/onmiso-hash/namu-agent.git#v0.1.68' 2>&1 >> $logPath; cd C:\Users\onmis\project\namu; docker --config C:\Users\onmis\project\temp_docker_config compose up -d 2>&1 >> $logPath } catch { echo 'NAMU deploy failed' 2>&1 >> $logPath }; echo '--- Cleanup Old NAMU Images ---' 2>&1 >> $logPath; Cleanup-Images 'namu-remote-mcp'; echo '--- Deploy NAMU Cloud Routing ---' 2>&1 >> $logPath; try { $routingBuild = 'C:\Users\onmis\project\namu-cloud-build'; if (Test-Path $routingBuild) { Remove-Item -Recurse -Force $routingBuild 2>&1 >> $logPath }; git clone --recurse-submodules --branch v0.1.51 https://github.com/onmiso-hash/namu-cloud-routing.git $routingBuild 2>&1 >> $logPath; docker --config C:\Users\onmis\project\temp_docker_config build -f ($routingBuild + '\deploy\Dockerfile') -t namu-cloud-routing:v0.1.51 $routingBuild 2>&1 >> $logPath; cd C:\Users\onmis\project\namu-cloud; docker --config C:\Users\onmis\project\temp_docker_config compose up -d 2>&1 >> $logPath } catch { echo 'NAMU Cloud Routing deploy failed' 2>&1 >> $logPath }; echo '--- Cleanup