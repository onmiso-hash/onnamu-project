name: Deploy to Mini PC

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            powershell -Command "$logPath = 'C:\Users\onmis\project\deploy.log'; $ErrorActionPreference = 'Continue'; $env:DOCKER_HOST = 'npipe:////./pipe/docker_engine'; cd C:\Users\onmis\project; echo '--- Git Fetch & Reset ---' 2>&1 > $logPath; try { git fetch origin main 2>&1 >> $logPath; git reset --hard origin/main 2>&1 >> $logPath } catch { echo 'Git reset failed' 2>&1 >> $logPath }; echo '--- Docker Config Clear (All Profiles with Dummy Auth) ---' 2>&1 >> $logPath; $configPaths = @('C:\Users\onmis\.docker\config.json', ($env:USERPROFILE + '\.docker\config.json'), 'C:\Windows\System32\config\systemprofile\.docker\config.json', 'C:\Windows\SysWOW64\config\systemprofile\.docker\config.json'); foreach ($cfgPath in $configPaths) { echo ('Checking: ' + $cfgPath) 2>&1 >> $logPath; $cfgDir = [System.IO.Path]::GetDirectoryName($cfgPath); if (-not (Test-Path $cfgDir)) { try { New-Item -ItemType Directory -Path $cfgDir -Force 2>&1 >> $logPath } catch {} }; try { [System.IO.File]::WriteAllText($cfgPath, ([char]123 + [char]34 + 'credsStore' + [char]34 + ':' + [char]34 + [char]34 + ',' + [char]34 + 'auths' + [char]34 + ':' + [char]123 + [char]34 + 'https://index.docker.io/v1/' + [char]34 + ':' + [char]123 + [char]125 + [char]125 + [char]125)); echo ('Cleared & Injected Dummy Auth: ' + $cfgPath) 2>&1 >> $logPath } catch { echo ('Failed to write: ' + $cfgPath) 2>&1 >> $logPath } }; echo '--- Copy Environment ---' 2>&1 >> $logPath; if (Test-Path C:\Users\onmis\project\gallery\.env) { Copy-Item C:\Users\onmis\project\gallery\.env C:\Users\onmis\project\studio\.env -Force 2>&1 >> $logPath; Copy-Item C:\Users\onmis\project\gallery\.env C:\Users\onmis\project\portal\.env -Force 2>&1 >> $logPath }; echo '--- Setup Temp Docker Config ---' 2>&1 >> $logPath; New-Item -ItemType Directory -Force -Path C:\Users\onmis\project\temp_docker_config 2>&1 >> $logPath; $env:DOCKER_CONFIG='C:\Users\onmis\project\temp_docker_config'; [System.IO.File]::WriteAllText('C:\Users\onmis\project\temp_docker_config\config.json', ([char]123 + [char]34 + 'credsStore' + [char]34 + ':' + [char]34 + [char]34 + ',' + [char]34 + 'auths' + [char]34 + ':' + [char]123 + [char]34 + 'https://index.docker.io/v1/' + [char]34 + ':' + [char]123 + [char]125 + [char]125 + [char]125)); echo '--- Deploy Gallery ---' 2>&1 >> $logPath; try { cd C:\Users\onmis\project\gallery; docker --config C:\Users\onmis\project\temp_docker_config compose up -d --build 2>&1 >> $logPath } catch { echo 'Gallery deploy failed' 2>&1 >> $logPath }; echo '--- Deploy Portal ---' 2>&1 >> $logPath; try { cd C:\Users\onmis\project\portal; docker --config C:\Users\onmis\project\temp_docker_config compose up -d --build 2>&1 >> $logPath } catch { echo 'Portal deploy failed' 2>&1 >> $logPath }; echo '--- Deploy Games ---' 2>&1 >> $logPath; try { cd C:\Users\onmis\project\games; docker --config C:\Users\onmis\project\temp_docker_config compose up -d --build 2>&1 >> $logPath } catch { echo 'Games deploy failed' 2>&1 >> $logPath }; echo '--- Deploy RDAP ---' 2>&1 >> $logPath; try { cd C:\Users\onmis\project\rdap; docker --config C:\Users\onmis\project\temp_docker_config compose down 2>&1 >> $logPath; docker --config C:\Users\onmis\project\temp_docker_config compose up -d --build 2>&1 >> $logPath } catch { echo 'RDAP deploy failed' 2>&1 >> $logPath }; echo '--- Kill Conflicting Node Process ---' 2>&1 >> $logPath; try { $conn = Get-NetTCPConnection -LocalPort 8080 -ErrorAction SilentlyContinue; if ($conn) { foreach ($c in $conn) { $p = Get-Process -Id $c.OwningProcess -ErrorAction SilentlyContinue; if ($p -and $p.Name -eq 'node') { echo 'Stopping conflicting node process' 2>&1 >> $logPath; Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue 2>&1 >> $logPath } } } } catch { echo 'Kill node process failed' 2>&1 >> $logPath }; echo '--- Docker Images List ---' 2>&1 >> $logPath; docker images 2>&1 >> $logPath; echo '--- Deploy Studio ---' 2>&1 >> $logPath; try { docker tag 8d6421d663b4 local-node:18-alpine 2>&1 >> $logPath; cd C:\Users\onmis\project\studio; $env:DOCKER_BUILDKIT=0; docker --config C:\Users\onmis\project\temp_docker_config compose up -d --build 2>&1 >> $logPath } catch { echo 'Studio deploy failed' 2>&1 >> $logPath }; echo '--- Current Commit ---' 2>&1 >> $logPath; git log -1 2>&1 >> $logPath; $secretKey = ''''; if (Test-Path ''C:\Users\onmis\project\gallery\.env'') { $envContent = Get-Content ''C:\Users\onmis\project\gallery\.env'' -Raw; if ($envContent -match ''SECRET_KEY=(.*)'') { $secretKey = $Matches[1].Trim() } }; try { $log = Get-Content -Raw -Path $logPath; $safeLog = $log; if ($log.Length -gt 3500) { $safeLog = $log.Substring(0, 3500) + ''... [Truncated]'' }; $safeLog = $safeLog -replace ''[\r]'', ''''; $body = @{ category = ''디버그''; title = ''배포 로그''; content = $safeLog; date = (Get-Date -Format ''yyyy-MM-dd'') } | ConvertTo-Json; Invoke-RestMethod -Uri ''https://onnamu.kr/api/work/save'' -Method Post -Body $body -Headers @{ ''X-API-Key'' = $secretKey } -ContentType ''application/json'' -ErrorAction SilentlyContinue } catch {}; try { $commitMsg = (git log -1 --format=%B).Trim(); $commitBody = @{ category = ''깃허브 푸시''; title = ''업데이트: onnamu-project''; content = $commitMsg; date = (Get-Date -Format ''yyyy-MM-dd'') } | ConvertTo-Json; Invoke-RestMethod -Uri ''https://onnamu.kr/api/work/save'' -Method Post -Body $commitBody -Headers @{ ''X-API-Key'' = $secretKey } -ContentType ''application/json'' -ErrorAction SilentlyContinue } catch {}; try { Copy-Item -Path $logPath -Destination ''C:\Users\onmis\media\public\images\deploy.log'' -Force } catch {}; Get-Content $logPath; exit 0"