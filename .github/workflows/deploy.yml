name: Deploy to Mini PC

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            powershell -Command "cd C:\Users\onmis\project; echo '--- Git Fetch & Reset ---' 2>&1 > deploy.log; git fetch origin main 2>&1 >> deploy.log; git reset --hard origin/main 2>&1 >> deploy.log; echo '--- Copy Environment ---' 2>&1 >> deploy.log; if (Test-Path C:\Users\onmis\project\gallery\.env) { Copy-Item C:\Users\onmis\project\gallery\.env C:\Users\onmis\project\studio\.env -Force 2>&1 >> deploy.log }; echo '--- Setup Temp Docker Config ---' 2>&1 >> deploy.log; New-Item -ItemType Directory -Force -Path C:\Users\onmis\project\temp_docker_config 2>&1 >> deploy.log; $env:DOCKER_CONFIG='C:\Users\onmis\project\temp_docker_config'; echo '--- Deploy Gallery ---' 2>&1 >> deploy.log; cd C:\Users\onmis\project\gallery; docker compose up -d --build 2>&1 >> deploy.log; echo '--- Deploy Portal ---' 2>&1 >> deploy.log; cd C:\Users\onmis\project\portal; docker compose up -d --build 2>&1 >> deploy.log; echo '--- Deploy Games ---' 2>&1 >> deploy.log; cd C:\Users\onmis\project\games; docker compose up -d --build 2>&1 >> deploy.log; echo '--- Deploy RDAP ---' 2>&1 >> deploy.log; cd C:\Users\onmis\project\rdap; docker compose down 2>&1 >> deploy.log; docker compose up -d --build 2>&1 >> deploy.log; echo '--- Kill Conflicting Node Process ---' 2>&1 >> deploy.log; $conn = Get-NetTCPConnection -LocalPort 8080 -ErrorAction SilentlyContinue; if ($conn) { foreach ($c in $conn) { $p = Get-Process -Id $c.OwningProcess -ErrorAction SilentlyContinue; if ($p -and $p.Name -eq 'node') { echo 'Stopping conflicting node process' 2>&1 >> deploy.log; Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue 2>&1 >> deploy.log } } }; echo '--- Deploy Studio ---' 2>&1 >> deploy.log; cd C:\Users\onmis\project\studio; docker compose build --no-cache 2>&1 >> deploy.log; docker compose up -d 2>&1 >> deploy.log; echo '--- Cleanup Temp Config ---' 2>&1 >> deploy.log; Remove-Item -Recurse -Force C:\Users\onmis\project\temp_docker_config 2>&1 >> deploy.log; echo '--- Current Commit ---' 2>&1 >> deploy.log; git log -1 2>&1 >> deploy.log; $log = Get-Content -Raw -Path deploy.log; $body = @{ category = '디버그'; title = '배포 로그'; content = $log; date = (Get-Date -Format 'yyyy-MM-dd') } | ConvertTo-Json; Invoke-RestMethod -Uri 'https://onnamu.kr/api/work/save' -Method Post -Body $body -ContentType 'application/json'; exit 0"

      # ✨ 카테고리와 타이틀을 한글로 수정한 버전이며, 따옴표와 줄바꿈 문제를 jq로 안전하게 처리한 버전이에요
      - name: Send Work Log to Portal
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          JSON_DATA=$(jq -n \
            --arg cat "깃허브 푸시" \
            --arg title "업데이트: ${{ github.event.repository.name }}" \
            --arg msg "$COMMIT_MSG" \
            --arg date "$(date +'%Y-%m-%d')" \
            '{category: $cat, title: $title, content: $msg, date: $date}')
          
          curl -X POST "https://onnamu.kr/api/work/save" \
          -H "Content-Type: application/json" \
          -d "$JSON_DATA"