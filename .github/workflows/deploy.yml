name: Deploy to Mini PC

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            powershell -Command "cd C:\Users\onmis\project; echo '--- Git Fetch & Reset ---'; git fetch origin main; git reset --hard origin/main; echo '--- Copy Environment ---'; if (Test-Path C:\Users\onmis\project\gallery\.env) { Copy-Item C:\Users\onmis\project\gallery\.env C:\Users\onmis\project\studio\.env -Force }; echo '--- Setup Temp Docker Config ---'; New-Item -ItemType Directory -Force -Path C:\Users\onmis\project\temp_docker_config; $env:DOCKER_CONFIG='C:\Users\onmis\project\temp_docker_config'; echo '--- Deploy Gallery ---'; cd C:\Users\onmis\project\gallery; docker compose up -d --build; echo '--- Deploy Portal ---'; cd C:\Users\onmis\project\portal; docker compose up -d --build; echo '--- Deploy Games ---'; cd C:\Users\onmis\project\games; docker compose up -d --build; echo '--- Deploy RDAP ---'; cd C:\Users\onmis\project\rdap; docker compose down; docker compose up -d --build; echo '--- Kill Conflicting Node Process ---'; $conn = Get-NetTCPConnection -LocalPort 8080 -ErrorAction SilentlyContinue; if ($conn) { foreach ($c in $conn) { $p = Get-Process -Id $c.OwningProcess -ErrorAction SilentlyContinue; if ($p -and $p.Name -eq 'node') { echo 'Stopping conflicting node process'; Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } } }; echo '--- Deploy Studio ---'; cd C:\Users\onmis\project\studio; docker compose build --no-cache; docker compose up -d; echo '--- Cleanup Temp Config ---'; Remove-Item -Recurse -Force C:\Users\onmis\project\temp_docker_config; echo '--- Current Commit ---'; git log -1"

      # ✨ 카테고리와 타이틀을 한글로 수정한 버전이며, 따옴표와 줄바꿈 문제를 jq로 안전하게 처리한 버전이에요
      - name: Send Work Log to Portal
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          JSON_DATA=$(jq -n \
            --arg cat "깃허브 푸시" \
            --arg title "업데이트: ${{ github.event.repository.name }}" \
            --arg msg "$COMMIT_MSG" \
            --arg date "$(date +'%Y-%m-%d')" \
            '{category: $cat, title: $title, content: $msg, date: $date}')
          
          curl -X POST "https://onnamu.kr/api/work/save" \
          -H "Content-Type: application/json" \
          -d "$JSON_DATA"