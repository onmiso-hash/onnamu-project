name: Deploy to Mini PC

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            powershell -Command "$logPath = 'C:\Users\onmis\project\deploy.log'; $ErrorActionPreference = 'Continue'; $env:DOCKER_HOST = 'npipe:////./pipe/docker_engine'; cd C:\Users\onmis\project; echo '--- Git Fetch & Reset ---' 2>&1 > $logPath; try { git fetch origin main 2>&1 >> $logPath; git reset --hard origin/main 2>&1 >> $logPath } catch { echo 'Git reset failed' 2>&1 >> $logPath }; echo '--- Docker Config Clear (All Profiles) ---' 2>&1 >> $logPath; $configPaths = @('C:\Users\onmis\.docker\config.json', \"$env:USERPROFILE\.docker\config.json\", 'C:\Windows\System32\config\systemprofile\.docker\config.json', 'C:\Windows\SysWOW64\config\systemprofile\.docker\config.json'); foreach ($cfgPath in $configPaths) { echo \"Checking: $cfgPath\" 2>&1 >> $logPath; if (Test-Path $cfgPath) { try { Set-Content -Path $cfgPath -Value '{\"credsStore\": \"\"}' -Force 2>&1 >> $logPath; echo \"Cleared: $cfgPath\" 2>&1 >> $logPath } catch { echo \"Failed to clear: $cfgPath\" 2>&1 >> $logPath } } else { try { New-Item -ItemType File -Path $cfgPath -Force 2>&1 >> $logPath; Set-Content -Path $cfgPath -Value '{\"credsStore\": \"\"}' -Force 2>&1 >> $logPath; echo \"Created and cleared: $cfgPath\" 2>&1 >> $logPath } catch { echo \"Could not create: $cfgPath\" 2>&1 >> $logPath } } }; echo '--- Copy Environment ---' 2>&1 >> $logPath; if (Test-Path C:\Users\onmis\project\gallery\.env) { Copy-Item C:\Users\onmis\project\gallery\.env C:\Users\onmis\project\studio\.env -Force 2>&1 >> $logPath }; echo '--- Setup Temp Docker Config ---' 2>&1 >> $logPath; New-Item -ItemType Directory -Force -Path C:\Users\onmis\project\temp_docker_config 2>&1 >> $logPath; $env:DOCKER_CONFIG='C:\Users\onmis\project\temp_docker_config'; Set-Content -Path C:\Users\onmis\project\temp_docker_config\config.json -Value '{\"credsStore\": \"\"}' -Force 2>&1 >> $logPath; echo '--- Deploy Gallery ---' 2>&1 >> $logPath; try { cd C:\Users\onmis\project\gallery; docker compose up -d --build 2>&1 >> $logPath } catch { echo 'Gallery deploy failed' 2>&1 >> $logPath }; echo '--- Deploy Portal ---' 2>&1 >> $logPath; try { cd C:\Users\onmis\project\portal; docker compose up -d --build 2>&1 >> $logPath } catch { echo 'Portal deploy failed' 2>&1 >> $logPath }; echo '--- Deploy Games ---' 2>&1 >> $logPath; try { cd C:\Users\onmis\project\games; docker compose up -d --build 2>&1 >> $logPath } catch { echo 'Games deploy failed' 2>&1 >> $logPath }; echo '--- Deploy RDAP ---' 2>&1 >> $logPath; try { cd C:\Users\onmis\project\rdap; docker compose down 2>&1 >> $logPath; docker compose up -d --build 2>&1 >> $logPath } catch { echo 'RDAP deploy failed' 2>&1 >> $logPath }; echo '--- Kill Conflicting Node Process ---' 2>&1 >> $logPath; try { $conn = Get-NetTCPConnection -LocalPort 8080 -ErrorAction SilentlyContinue; if ($conn) { foreach ($c in $conn) { $p = Get-Process -Id $c.OwningProcess -ErrorAction SilentlyContinue; if ($p -and $p.Name -eq 'node') { echo 'Stopping conflicting node process' 2>&1 >> $logPath; Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue 2>&1 >> $logPath } } } } catch { echo 'Kill node process failed' 2>&1 >> $logPath }; echo '--- Docker Images List ---' 2>&1 >> $logPath; docker images 2>&1 >> $logPath; echo '--- Pre-pull Node Alpine Image ---' 2>&1 >> $logPath; try { docker --config C:\Users\onmis\project\temp_docker_config pull node:18-alpine 2>&1 >> $logPath } catch { echo 'Pre-pull node image failed' 2>&1 >> $logPath }; echo '--- Deploy Studio ---' 2>&1 >> $logPath; try { cd C:\Users\onmis\project\studio; $env:DOCKER_CONFIG='C:\Users\onmis\project\temp_docker_config'; $env:DOCKER_BUILDKIT=0; docker compose up -d --build 2>&1 >> $logPath } catch { echo 'Studio deploy failed' 2>&1 >> $logPath }; echo '--- Cleanup Temp Config ---' 2>&1 >> $logPath; Remove-Item -Recurse -Force C:\Users\onmis\project\temp_docker_config 2>&1 >> $logPath; echo '--- Current Commit ---' 2>&1 >> $logPath; git log -1 2>&1 >> $logPath; try { $log = Get-Content -Raw -Path $logPath; $safeLog = $log; if ($log.Length -gt 3500) { $safeLog = $log.Substring(0, 3500) + '... [Truncated]' }; $safeLog = $safeLog -replace '[\r]', ''; $body = @{ category = '디버그'; title = '배포 로그'; content = $safeLog; date = (Get-Date -Format 'yyyy-MM-dd') } | ConvertTo-Json; Invoke-RestMethod -Uri 'https://onnamu.kr/api/work/save' -Method Post -Body $body -ContentType 'application/json' -ErrorAction SilentlyContinue } catch {}; Get-Content $logPath; exit 0"

      # ✨ 카테고리와 타이틀을 한글로 수정한 버전이며, 따옴표와 줄바꿈 문제를 jq로 안전하게 처리한 버전이에요
      - name: Send Work Log to Portal
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          JSON_DATA=$(jq -n \
            --arg cat "깃허브 푸시" \
            --arg title "업데이트: ${{ github.event.repository.name }}" \
            --arg msg "$COMMIT_MSG" \
            --arg date "$(date +'%Y-%m-%d')" \
            '{category: $cat, title: $title, content: $msg, date: $date}')
          
          curl -X POST "https://onnamu.kr/api/work/save" \
          -H "Content-Type: application/json" \
          -d "$JSON_DATA"