name: Mini PC diagnosis (read-only)

# 2026-10-15 다운 조치용 점검. 작업 브랜치에 푸시할 때만 돈다 — main 배포(deploy.yml)는 건드리지 않는다.
#
# 왜 필요한가: 2026-10-14 01:20~06:25 KST 사이 Docker Desktop 엔진이 죽어 컨테이너 12개가
# 전부 내려갔고(네 도메인 530 = 터널에 오리진 0개) 18시간 넘게 복구되지 않았다. 웹 세션에는
# ssh 바이너리도 키도 없고 프록시가 onnamu.kr 을 막으므로, 미니PC 상태를 보는 길은 이 경로뿐이다.
#
# 미니PC에서는 읽기만 한다. 고치는 동작(도커 재시작 등)은 넣지 않는다: SSH 세션에서 띄운
# Docker Desktop 은 접속이 끊길 때 함께 정리되므로(2026-09-10·09-14 실측,
# scripts/docker_watchdog.ps1 주석) 효과가 없다.
#
# 점검 회차: 7 — CPU 사용률이 높다는 신고. 무엇이 먹고 있는지 본다.
#
#   첫 용의자는 어제(#17) 바꾼 감시 판정이다. 새 판정이 멀쩡한 엔진을 실패로 오판하면
#   watchdog 이 연속 2회 뒤 Docker Desktop 을 죽이고 다시 띄우며, 10분 냉각을 두고
#   이것을 반복한다 — 약 13분 주기로 도커가 재시작되면 CPU 를 계속 먹는다. 그래서
#   watchdog.log 와 state.json, Docker Desktop 프로세스의 시작 시각을 먼저 본다.
#
#   그 다음 일반 용의자 — 프로세스별 현재 CPU%, 컨테이너별 CPU(docker stats).
#
#   회차 6은 보낼 명령이 12,586자가 되어 윈도우가 "명령줄이 너무 깁니다"로 거부했다
#   (SSH 는 붙었고 윈도우가 답한 것이다 — 미니PC 장애가 아니다). 실측 한계는 약
#   8,190자이며 scripts/check_deploy_cmd_len.sh 에 그 근거가 적혀 있다. 그 검사는
#   워크플로 YAML 의 '줄 길이'만 보므로, 히어독+base64 로 실행 시점에 조립되는 이
#   명령은 걸러내지 못한다 — 사각지대다. 그래서 회차 7은 꼭 필요한 것만 남겼다.

on:
  push:
    branches:
      - claude/nifty-brahmagupta-z0jsdk
    paths:
      - .github/workflows/minipc-diag.yml
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: What is eating the CPU
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          PORT: ${{ secrets.PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          cat > d.ps1 <<'EOF'
          $ErrorActionPreference='Continue'; $ProgressPreference='SilentlyContinue'
          [Console]::OutputEncoding=[Text.Encoding]::UTF8
          $d='C:\Program Files\Docker\Docker\resources\bin\docker.exe'
          $w=Join-Path $env:USERPROFILE 'docker_watchdog'
          $cs=Get-CimInstance Win32_ComputerSystem; $os=Get-CimInstance Win32_OperatingSystem
          '## 0 기본'
          ('  코어 '+$cs.NumberOfLogicalProcessors+' | 부팅 '+$os.LastBootUpTime)
          ('  메모리 여유 '+[math]::Round($os.FreePhysicalMemory/1MB,2)+'GB / '+[math]::Round($cs.TotalPhysicalMemory/1GB,1)+'GB')
          '## 1 감시가 도커를 반복 재시작하는가 (어제 바꾼 판정이 용의자)'
          $f=Join-Path $w 'watchdog.log'
          if(Test-Path $f){
            $t=Get-Content $f -Tail 20; '--- 최근 20줄'; $t
            $o=Get-Content $f|Where-Object{$_ -match '^2026-10-15'}
            ('--- 오늘 줄수 '+@($o).Count+' | 다시띄운다 '+@($o|Where-Object{$_ -match '다시 띄운다'}).Count+'회  → 0이면 무죄')
          }else{'  로그 없음'}
          foreach($n in 'state.json','info.out','info.err'){
            $p2=Join-Path $w $n
            if(Test-Path $p2){('  '+$n+' '+(Get-Item $p2).LastWriteTime+' = '+(((Get-Content $p2 -Raw -EA 0) -replace '\s','')))}
          }
          (Get-ScheduledTaskInfo -TaskName NamuDockerWatchdog|Select-Object LastRunTime,LastTaskResult|Format-List|Out-String).Trim()
          '## 2 도커/WSL 프로세스 (시작시각이 최근이면 방금 재시작)'
          (Get-Process 'Docker Desktop','com.docker.backend','vmmem','vmmemWSL' -EA 0|
            Select-Object Name,Id,StartTime,@{n='CPU초';e={[math]::Round($_.CPU)}},@{n='MB';e={[math]::Round($_.WorkingSet64/1MB)}}|
            Format-Table -AutoSize|Out-String).Trim()
          '## 3 전체 CPU (2초x3)'
          try{(Get-Counter '\Processor(_Total)\% Processor Time' -SampleInterval 2 -MaxSamples 3 -EA Stop).CounterSamples|
            ForEach-Object{'  '+[math]::Round($_.CookedValue,1)+'%'}}catch{'  실패'}
          '## 4 프로세스별 CPU% 상위 12 (코어 합산)'
          (Get-CimInstance Win32_PerfFormattedData_PerfProc_Process|
            Where-Object{$_.Name -notin '_Total','Idle'}|Sort-Object PercentProcessorTime -Descending|
            Select-Object -First 12 @{n='이름';e={$_.Name}},@{n='PID';e={$_.IDProcess}},
              @{n='CPU%';e={$_.PercentProcessorTime}},@{n='MB';e={[math]::Round($_.WorkingSetPrivate/1MB)}}|
            Format-Table -AutoSize|Out-String).Trim()
          '## 5 컨테이너별 CPU/MEM'
          (& $d stats --no-stream --format '{{.Name}} CPU {{.CPUPerc}} MEM {{.MemUsage}}' 2>&1|Out-String).Trim()
          EOF

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          b64=$(iconv -f UTF-8 -t UTF-16LE d.ps1 | base64 -w0)

          ok=0
          for i in $(seq 1 12); do
            if ssh -i ~/.ssh/k -p "$PORT" \
                   -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                   -o ConnectTimeout=15 -o LogLevel=ERROR "$USERNAME@$HOST" \
                   "powershell -NoProfile -NonInteractive -EncodedCommand $b64"; then
              ok=1; break
            fi
            echo "--- SSH 시도 $i 실패 — 15초 후 재시도"
            sleep 15
          done
          rm -f ~/.ssh/k

          if [ "$ok" -ne 1 ]; then
            echo "::error::SSH 접속 실패 — 미니PC 응답 없음"
            exit 1
          fi
