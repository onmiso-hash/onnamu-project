name: Mini PC diagnosis (read-only)

# 2026-10-15 다운 조치용 점검. 작업 브랜치에 푸시할 때만 돈다 — main 배포(deploy.yml)는 건드리지 않는다.
#
# 왜 필요한가: 2026-10-14 01:20~06:25 KST 사이 Docker Desktop 엔진이 죽어 컨테이너 12개가
# 전부 내려갔고(네 도메인 530 = 터널에 오리진 0개) 18시간 넘게 복구되지 않았다. 웹 세션에는
# ssh 바이너리도 키도 없고 프록시가 onnamu.kr 을 막으므로, 미니PC 상태를 보는 길은 이 경로뿐이다.
#
# 미니PC에서는 읽기만 한다. 고치는 동작(도커 재시작 등)은 넣지 않는다: SSH 세션에서 띄운
# Docker Desktop 은 접속이 끊길 때 함께 정리되므로(2026-09-10·09-14 실측,
# scripts/docker_watchdog.ps1 주석) 효과가 없다.
#
# 점검 회차: 5 — 배포 뒤 적용 확인. 깔린 파일이 새 판인지, 감시가 그 파일로 돌고
#   있는지, 서비스가 멀쩡한지를 미니PC 실물에서 본다. 배포 워크플로의 'success' 는
#   증거가 아니다 — deploy.ps1 이 종료코드를 보지 않고 무조건 exit 0 으로 끝나므로
#   docker 단계가 전부 실패해도 초록불이 뜬다(2026-10-14 실측).
#
# 손으로도 돌릴 수 있게 workflow_dispatch 를 더했다. 그 전에는 확인할 때마다 이
#   파일을 고쳐 커밋해야 했다.

on:
  push:
    branches:
      - claude/nifty-brahmagupta-z0jsdk
    paths:
      - .github/workflows/minipc-diag.yml
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify the fix is live on Mini PC
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          PORT: ${{ secrets.PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          cat > d.ps1 <<'EOF'
          $ErrorActionPreference='Continue'; $ProgressPreference='SilentlyContinue'
          [Console]::OutputEncoding=[Text.Encoding]::UTF8
          $proj = 'C:\Users\onmis\project'
          $docker = 'C:\Program Files\Docker\Docker\resources\bin\docker.exe'

          '########## 1. 깔린 감시 파일이 새 판인가'
          $live = Join-Path $proj 'scripts\docker_watchdog.ps1'
          if (-not (Test-Path $live)) { '  파일 없음: ' + $live }
          else {
            $l = Get-Content $live -Raw
            ('  크기: ' + $l.Length + '자  (옛 판 4618 / 새 판 6237)')
            ('  새 판정 version 있음 : ' + ($l -match "ArgumentList 'version'"))
            ('  새 판정 Server.Version: ' + ($l -match 'Server\.Version'))
            ('  옛 판정 info 잔존     : ' + ($l -match "ArgumentList 'info'"))
            ('  출력 읽음 outPath     : ' + ($l -match 'outPath'))
            ('  실패 사유 로깅        : ' + ($l -match 'engineReason'))
            $t=$null;$e=$null
            $null = [System.Management.Automation.Language.Parser]::ParseInput($l,[ref]$t,[ref]$e)
            ('  깔린 파일 구문 오류   : ' + @($e).Count + '건')
          }

          '########## 2. 저장소 커밋'
          Push-Location $proj; (git log -1 --format='  %h %s' 2>&1); Pop-Location

          '########## 3. 감시가 그 파일로 돌고 있는가'
          (Get-ScheduledTask -TaskName NamuDockerWatchdog | Select-Object State |
             Format-List | Out-String).Trim()
          (Get-ScheduledTaskInfo -TaskName NamuDockerWatchdog |
             Select-Object LastRunTime, LastTaskResult, NextRunTime |
             Format-List | Out-String).Trim()
          $io = Join-Path $env:USERPROFILE 'docker_watchdog\info.out'
          if (Test-Path $io) {
            ('  info.out 마지막 기록: ' + (Get-Item $io).LastWriteTime +
             '  내용 "' + ((Get-Content $io -Raw -EA 0) -replace '\s','') + '"')
            '  → 이 시각이 최근이면 감시가 실제로 엔진을 찔러 본 것이다'
          } else { '  info.out 없음' }
          $sf = Join-Path $env:USERPROFILE 'docker_watchdog\state.json'
          if (Test-Path $sf) { ('  state.json: ' + ((Get-Content $sf -Raw) -replace '\s','')) }

          '########## 4. watchdog 로그 최근 5줄'
          $wl = Join-Path $env:USERPROFILE 'docker_watchdog\watchdog.log'
          if (Test-Path $wl) { Get-Content $wl -Tail 5 } else { '로그 없음' }
          '  (엔진이 멀쩡하면 아무것도 안 적는 것이 정상이다)'

          '########## 5. 배포 로그에 실제 실패가 있었나'
          $dl = Join-Path $proj 'deploy.log'
          if (Test-Path $dl) {
            $d = Get-Content $dl -Raw
            ('  "unable to start" 횟수      : ' + ([regex]::Matches($d,'unable to start')).Count)
            ('  "Error response from daemon" : ' + ([regex]::Matches($d,'Error response from daemon')).Count)
            ('  "Container .* Running" 횟수  : ' + ([regex]::Matches($d,'Container .*Running')).Count)
          } else { '  deploy.log 없음' }

          '########## 6. 엔진·컨테이너'
          ('  엔진 서버 버전: ' + (& $docker version --format '{{.Server.Version}}' 2>&1))
          (& $docker ps --format '{{.Names}} | {{.Status}}' 2>&1 | Out-String).Trim()
          EOF

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          b64=$(iconv -f UTF-8 -t UTF-16LE d.ps1 | base64 -w0)

          ok=0
          for i in $(seq 1 12); do
            if ssh -i ~/.ssh/k -p "$PORT" \
                   -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                   -o ConnectTimeout=15 -o LogLevel=ERROR "$USERNAME@$HOST" \
                   "powershell -NoProfile -NonInteractive -EncodedCommand $b64"; then
              ok=1; break
            fi
            echo "--- SSH 시도 $i 실패 — 15초 후 재시도"
            sleep 15
          done
          rm -f ~/.ssh/k

          if [ "$ok" -ne 1 ]; then
            echo "::error::SSH 접속 실패 — 미니PC 응답 없음"
            exit 1
          fi
