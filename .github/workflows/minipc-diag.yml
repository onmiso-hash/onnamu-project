name: Mini PC diagnosis (read-only)

# 2026-10-15 다운 조치용 점검. 작업 브랜치에 푸시할 때만 돈다 — main 배포(deploy.yml)는 건드리지 않는다.
#
# 왜 필요한가: 2026-10-14 01:20~06:25 KST 사이 Docker Desktop 엔진이 죽어 컨테이너 12개가
# 전부 내려갔고(네 도메인 530 = 터널에 오리진 0개) 18시간 넘게 복구되지 않았다. 웹 세션에는
# ssh 바이너리도 키도 없고 프록시가 onnamu.kr 을 막으므로, 미니PC 상태를 보는 길은 이 경로뿐이다.
#
# 미니PC에서는 읽기만 한다. 고치는 동작(도커 재시작 등)은 넣지 않는다: SSH 세션에서 띄운
# Docker Desktop 은 접속이 끊길 때 함께 정리되므로(2026-09-10·09-14 실측,
# scripts/docker_watchdog.ps1 주석) 효과가 없다.
#
# 점검 회차: 8 — CPU 사용률이 높다는 신고. 무엇이 먹고 있는지 본다.
#
#   첫 용의자는 어제(#17) 바꾼 감시 판정이다. 새 판정이 멀쩡한 엔진을 실패로 오판하면
#   watchdog 이 연속 2회 뒤 Docker Desktop 을 죽이고 다시 띄우며, 10분 냉각을 두고
#   이것을 반복한다 — 약 13분 주기로 도커가 재시작되면 CPU 를 계속 먹는다. 그래서
#   watchdog.log 와 state.json, Docker Desktop 프로세스의 시작 시각을 먼저 본다.
#
#   그 다음 일반 용의자 — 프로세스별 현재 CPU%, 컨테이너별 CPU(docker stats).
#
#   회차 6은 보낼 명령이 12,586자가 되어 윈도우가 "명령줄이 너무 깁니다"로 거부했다
#   (SSH 는 붙었고 윈도우가 답한 것이다 — 미니PC 장애가 아니다). 실측 한계는 약
#   8,190자이며 scripts/check_deploy_cmd_len.sh 에 그 근거가 적혀 있다. 그 검사는
#   워크플로 YAML 의 '줄 길이'만 보므로, 히어독+base64 로 실행 시점에 조립되는 이
#   명령은 걸러내지 못한다 — 사각지대다. 그래서 회차 7은 꼭 필요한 것만 남겼다.

on:
  push:
    branches:
      - claude/nifty-brahmagupta-z0jsdk
    paths:
      - .github/workflows/minipc-diag.yml
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: What is eating the CPU
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          PORT: ${{ secrets.PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          cat > d.ps1 <<'EOF'
          $ErrorActionPreference='Continue'; $ProgressPreference='SilentlyContinue'
          [Console]::OutputEncoding=[Text.Encoding]::UTF8
          $d='C:\Program Files\Docker\Docker\resources\bin\docker.exe'
          '## 1 컨테이너별 분당 로그 폭주 (최근 60분, 바쁜 5분만)'
          foreach($c in 'my-gallery','my-portal','chronicle-studio','stream-nginx','my-rdap','rdap-bootstrap','n8n'){
            $l=& $d logs --since 60m --timestamps $c 2>&1
            $n=@($l).Count
            if($n -gt 0){
              ('--- '+$c+' 총 '+$n+'줄')
              $l|Where-Object{$_ -match '^\d{4}-'}|Group-Object{$_.Substring(0,16)}|
                Sort-Object Count -Descending|Select-Object -First 5|
                ForEach-Object{'    '+$_.Name+' : '+$_.Count+'줄'}
            } else {('--- '+$c+' 0줄')}
          }
          '## 2 갤러리/영화관에 영상 원본 요청이 있었나 (08-20 미해결 고장)'
          $g=& $d logs --since 60m --timestamps my-gallery 2>&1
          ($g|Where-Object{$_ -match '\.(mp4|mkv|mov|avi|webm)'}|Select-Object -First 15)
          ('  영상 요청 줄수: '+@($g|Where-Object{$_ -match '\.(mp4|mkv|mov|avi|webm)'}).Count)
          ('  200 전체전송: '+@($g|Where-Object{$_ -match '\.(mp4|mkv|mov|avi|webm)' -and $_ -match ' 200 '}).Count)
          ('  206 부분전송: '+@($g|Where-Object{$_ -match '\.(mp4|mkv|mov|avi|webm)' -and $_ -match ' 206 '}).Count)
          '## 3 윈도우 디펜더 검사 기록 (최근 12시간)'
          try{
            Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-Windows Defender/Operational';
              StartTime=(Get-Date).AddHours(-12)} -EA Stop|
              Where-Object{$_.Id -in 1000,1001,1002,2000,2001}|Sort-Object TimeCreated|
              ForEach-Object{'  '+$_.TimeCreated.ToString('HH:mm:ss')+' ['+$_.Id+'] '+(($_.Message -split "`n")[0]).Trim()}|
              Select-Object -First 15
          }catch{'  디펜더 로그 조회 실패/없음'}
          ('  MsMpEng 누적CPU초: '+[math]::Round((Get-Process MsMpEng -EA 0).CPU))
          '## 4 시스템+응용 로그 전체 (최근 3시간, 경고/오류만)'
          try{
            Get-WinEvent -FilterHashtable @{LogName='System','Application';
              StartTime=(Get-Date).AddHours(-3); Level=2,3} -EA Stop|Sort-Object TimeCreated|
              ForEach-Object{'  '+$_.TimeCreated.ToString('HH:mm:ss')+' '+$_.ProviderName+' ['+$_.Id+'] '+(($_.Message -split "`n")[0]).Trim()}|
              Select-Object -First 25
          }catch{'  해당 없음'}
          '## 5 프로세스 누적CPU초 상위 12 (부팅 이후 총량 — 지나간 폭주가 남는다)'
          (Get-Process|Where-Object{$_.CPU -gt 0}|Sort-Object CPU -Descending|Select-Object -First 12 |
            Select-Object Name,Id,@{n='CPU초';e={[math]::Round($_.CPU)}},@{n='MB';e={[math]::Round($_.WorkingSet64/1MB)}}|
            Format-Table -AutoSize|Out-String).Trim()
          EOF

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          b64=$(iconv -f UTF-8 -t UTF-16LE d.ps1 | base64 -w0)

          ok=0
          for i in $(seq 1 12); do
            if ssh -i ~/.ssh/k -p "$PORT" \
                   -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                   -o ConnectTimeout=15 -o LogLevel=ERROR "$USERNAME@$HOST" \
                   "powershell -NoProfile -NonInteractive -EncodedCommand $b64"; then
              ok=1; break
            fi
            echo "--- SSH 시도 $i 실패 — 15초 후 재시도"
            sleep 15
          done
          rm -f ~/.ssh/k

          if [ "$ok" -ne 1 ]; then
            echo "::error::SSH 접속 실패 — 미니PC 응답 없음"
            exit 1
          fi
