name: Mini PC diagnosis (read-only)

# 2026-10-07 미니PC BIOS 공식 판 확인용 일회성 점검.
# 작업 브랜치에 푸시할 때만 돈다 — main 배포(deploy.yml)는 건드리지 않는다.
# 미니PC에서는 모델·BIOS 정보만 읽는다. 조사가 끝나면 이 파일은 지운다.

on:
  push:
    branches:
      - claude/keen-gates-kynovp
    paths:
      - .github/workflows/minipc-diag.yml

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: MSI BIOS list from Mini PC
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          PORT: ${{ secrets.PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          cat > m.ps1 <<'EOF'
          $ErrorActionPreference='SilentlyContinue'; $ProgressPreference='SilentlyContinue'
          [Console]::OutputEncoding=[Text.Encoding]::UTF8
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36'
          foreach ($p in 'Cubi-2','Cubi-2-7th','Cubi-2-Plus') {
            '########## ' + $p
            try {
              $r = Invoke-WebRequest -UseBasicParsing -UserAgent $ua -TimeoutSec 30 ("https://www.msi.com/api/v1/product/support/panel?product=$p&type=bios")
              'http ' + $r.StatusCode
              $j = $r.Content | ConvertFrom-Json
              function W($o) {
                if ($o -is [System.Management.Automation.PSCustomObject]) {
                  $n = $o.PSObject.Properties.Name
                  if ($n -contains 'download_version') { ' - ' + $o.download_title + ' | ' + $o.download_version + ' | ' + $o.download_release + ' | ' + (([string]$o.download_description) -replace '\s+',' ') + ' | ' + $o.download_url }
                  foreach ($x in $o.PSObject.Properties) { W $x.Value }
                } elseif ($o -is [array]) { foreach ($x in $o) { W $x } }
              }
              W $j
              if (-not ($r.Content -match 'download_version')) { $r.Content.Substring(0,[Math]::Min(500,$r.Content.Length)) }
            } catch { 'error: ' + $_.Exception.Message }
          }
          EOF
          mkdir -p ~/.ssh; printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/k; chmod 600 ~/.ssh/k
          b64=$(iconv -f UTF-8 -t UTF-16LE m.ps1 | base64 -w0)
          ssh -i ~/.ssh/k -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=20 -o LogLevel=ERROR "$USERNAME@$HOST" \
              "powershell -NoProfile -NonInteractive -EncodedCommand $b64" || echo "(exit $?)"
          rm -f ~/.ssh/k

