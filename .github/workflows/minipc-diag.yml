name: Mini PC diagnosis (read-only)

# 2026-10-07 미니PC CPU 100%·파워셸 창 누적 원인 조사용 일회성 점검.
# 작업 브랜치에 푸시할 때만 돈다 — main 배포(deploy.yml)는 건드리지 않는다.
# 미니PC에서는 조회 명령만 실행한다. 이 저장소는 공개라 로그도 공개다:
# 프로세스 명령줄은 찍지 않는다(배포 중이면 -AskApiKey 값이 들어 있을 수 있다).
# 조사가 끝나면 이 파일은 브랜치에서 지운다.

on:
  push:
    branches:
      - claude/keen-gates-kynovp
    paths:
      - .github/workflows/minipc-diag.yml

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Write diagnosis scripts
        run: |
          mkdir -p diag
          cat > diag/1_power.ps1 <<'EOF'
          $ErrorActionPreference='SilentlyContinue'; $ProgressPreference='SilentlyContinue'
          [Console]::OutputEncoding=[Text.Encoding]::UTF8
          '== A. 프로세서 유휴 끄기(IDLEDISABLE) — 0x00000001 이면 켜져 있음'
          powercfg /getactivescheme
          (powercfg /qh SCHEME_CURRENT SUB_PROCESSOR 5d76a2ca-e8c0-402f-a133-2158492d58ad) -match '0x0000000'
          '== B. BIOS'
          Get-CimInstance Win32_BIOS | % { 'BIOS ' + $_.SMBIOSBIOSVersion + ' / ' + $_.ReleaseDate }
          '== C. 덤프 파일'
          Get-ChildItem C:\Windows\Minidump | Sort-Object LastWriteTime | % { '{0:yyyy-MM-dd HH:mm} {1} {2}KB' -f $_.LastWriteTime,$_.Name,[int]($_.Length/1KB) }
          Get-Item C:\Windows\MEMORY.DMP | % { 'MEMORY.DMP {0:yyyy-MM-dd HH:mm} {1}MB' -f $_.LastWriteTime,[int]($_.Length/1MB) }
          '== D. 감시 작업 설정'
          $t = Get-ScheduledTask -TaskName NamuDockerWatchdog
          'limit=' + $t.Settings.ExecutionTimeLimit + ' multi=' + $t.Settings.MultipleInstances + ' logon=' + $t.Principal.LogonType
          EOF
          cat > diag/2_crashes.ps1 <<'EOF'
          $ErrorActionPreference='SilentlyContinue'; $ProgressPreference='SilentlyContinue'
          [Console]::OutputEncoding=[Text.Encoding]::UTF8
          '== E. 비정상 종료(41) 08-01 이후 — 8월 절전 끄기 조치(08-28) 전후 비교'
          Get-WinEvent -FilterHashtable @{LogName='System';Id=41;StartTime=[datetime]'2026-08-01'} | Sort-Object TimeCreated | % {
            '{0:yyyy-MM-dd HH:mm:ss} BugcheckCode=0x{1:X}' -f $_.TimeCreated,[int64]$_.Properties[0].Value
          }
          EOF

      - name: Run on Mini PC
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          PORT: ${{ secrets.PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          for f in diag/*.ps1; do
            echo "########## $f"
            b64=$(iconv -f UTF-8 -t UTF-16LE "$f" | base64 -w0)
            ssh -i ~/.ssh/k -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                -o ConnectTimeout=20 -o LogLevel=ERROR "$USERNAME@$HOST" \
                "powershell -NoProfile -NonInteractive -EncodedCommand $b64" || echo "(exit $?)"
          done
          rm -f ~/.ssh/k
