name: Mini PC diagnosis (read-only)

# 2026-10-15 다운 조치용 점검. 작업 브랜치에 푸시할 때만 돈다 — main 배포(deploy.yml)는 건드리지 않는다.
#
# 왜 필요한가: 2026-10-14 01:20~06:25 KST 사이 Docker Desktop 엔진이 죽어 컨테이너 12개가
# 전부 내려갔고(네 도메인 530 = 터널에 오리진 0개) 18시간 넘게 복구되지 않았다. 웹 세션에는
# ssh 바이너리도 키도 없고 프록시가 onnamu.kr 을 막으므로, 미니PC 상태를 보는 길은 이 경로뿐이다.
#
# 미니PC에서는 읽기만 한다. 고치는 동작(도커 재시작 등)은 넣지 않는다: SSH 세션에서 띄운
# Docker Desktop 은 접속이 끊길 때 함께 정리되므로(2026-09-10·09-14 실측,
# scripts/docker_watchdog.ps1 주석) 효과가 없다.
#
# 점검 회차: 14 — CPU 사용률이 높다는 신고. 무엇이 먹고 있는지 본다.
#
#   첫 용의자는 어제(#17) 바꾼 감시 판정이다. 새 판정이 멀쩡한 엔진을 실패로 오판하면
#   watchdog 이 연속 2회 뒤 Docker Desktop 을 죽이고 다시 띄우며, 10분 냉각을 두고
#   이것을 반복한다 — 약 13분 주기로 도커가 재시작되면 CPU 를 계속 먹는다. 그래서
#   watchdog.log 와 state.json, Docker Desktop 프로세스의 시작 시각을 먼저 본다.
#
#   대기시간은 짧게 둔다(2026-10-21 사용자 요청) — SSH 재시도 3회x5초, 연결 타임아웃
#   5초, 포트 확인 3초. 응답 없는 상대를 오래 붙잡고 있으면 결과만 늦어진다.
#
#   그 다음 일반 용의자 — 프로세스별 현재 CPU%, 컨테이너별 CPU(docker stats).
#
#   회차 6은 보낼 명령이 12,586자가 되어 윈도우가 "명령줄이 너무 깁니다"로 거부했다
#   (SSH 는 붙었고 윈도우가 답한 것이다 — 미니PC 장애가 아니다). 실측 한계는 약
#   8,190자이며 scripts/check_deploy_cmd_len.sh 에 그 근거가 적혀 있다. 그 검사는
#   워크플로 YAML 의 '줄 길이'만 보므로, 히어독+base64 로 실행 시점에 조립되는 이
#   명령은 걸러내지 못한다 — 사각지대다. 그래서 회차 7은 꼭 필요한 것만 남겼다.

on:
  push:
    branches:
      - claude/nifty-brahmagupta-z0jsdk
    paths:
      - .github/workflows/minipc-diag.yml
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: What is eating the CPU
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          PORT: ${{ secrets.PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          cat > d.ps1 <<'EOF'
          $ErrorActionPreference='Continue'; $ProgressPreference='SilentlyContinue'
          [Console]::OutputEncoding=[Text.Encoding]::UTF8
          $hp='172.30.1.89'; $hpUser='onmis'
          '## 0 여기가 어느 기계인가 (증거는 기계가 말하게 한다)'
          ('  COMPUTERNAME: '+$env:COMPUTERNAME)
          '## 1 HP 가 켜져 있고 SSH 문이 열렸나'
          # Test-NetConnection 은 응답 없는 상대에게 20초까지 매달린다 — 3초로 자른다.
          $t=$false
          try{
            $c=New-Object Net.Sockets.TcpClient
            $t=$c.ConnectAsync($hp,22).Wait(3000) -and $c.Connected
            $c.Close()
          }catch{}
          ('  '+$hp+':22 열림: '+$t+'  (3초 안에 응답했는가)')
          if(-not $t){'  → 꺼져 있거나 SSH 가 안 켜졌거나 방화벽이 막음'}
          '## 2 미니PC 에 HP 로 갈 열쇠·설정이 있나 (파일 이름만, 내용은 안 본다)'
          foreach($d in "$env:USERPROFILE\.ssh"){
            if(Test-Path $d){
              (Get-ChildItem $d -Force|Select-Object -First 15|ForEach-Object{'  '+$_.Name+'  '+$_.Length+'B'})
            } else {'  '+$d+' 없음'}
          }
          '## 3 미니PC → HP 무인 인증이 되나 (암호를 묻지 않게 BatchMode)'
          $r=(& ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=5 `
                 ("$hpUser@$hp") "hostname" 2>&1|Out-String).Trim()
          ('  결과: '+$r)
          if($r -match 'onmiso-hp|HP'){'  → 무인 인증 성공'}
          elseif($r -match 'Permission denied|publickey'){'  → 열쇠 없음/암호 필요 — 무인 접속 불가'}
          else{'  → 판정 보류 (위 메시지 참고)'}
          '## 4 되면 WSL 작업 폴더까지 닿나'
          if($r -match 'onmiso-hp|HP'){
            (& ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=5 `
                ("$hpUser@$hp") "wsl -e bash -lc 'pwd; ls ~/project 2>/dev/null | head -5'" 2>&1|
               ForEach-Object{'  '+[string]$_})
          } else {'  3번이 안 됐으므로 건너뜀'}
          EOF

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          b64=$(iconv -f UTF-8 -t UTF-16LE d.ps1 | base64 -w0)

          ok=0
          for i in $(seq 1 3); do
            if ssh -i ~/.ssh/k -p "$PORT" \
                   -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                   -o ConnectTimeout=5 -o LogLevel=ERROR "$USERNAME@$HOST" \
                   "powershell -NoProfile -NonInteractive -EncodedCommand $b64"; then
              ok=1; break
            fi
            echo "--- SSH 시도 $i 실패 — 5초 후 재시도"
            sleep 5
          done
          rm -f ~/.ssh/k

          if [ "$ok" -ne 1 ]; then
            echo "::error::SSH 접속 실패 — 미니PC 응답 없음"
            exit 1
          fi
