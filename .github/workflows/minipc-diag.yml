name: Mini PC diagnosis (read-only)

# 2026-10-15 다운 조치용 점검. 작업 브랜치에 푸시할 때만 돈다 — main 배포(deploy.yml)는 건드리지 않는다.
#
# 왜 필요한가: 2026-10-14 01:20~06:25 KST 사이 Docker Desktop 엔진이 죽어 컨테이너 12개가
# 전부 내려갔고(네 도메인 530 = 터널에 오리진 0개) 18시간 넘게 복구되지 않았다. 웹 세션에는
# ssh 바이너리도 키도 없고 프록시가 onnamu.kr 을 막으므로, 미니PC 상태를 보는 길은 이 경로뿐이다.
#
# 미니PC에서는 읽기만 한다. 고치는 동작(도커 재시작 등)은 넣지 않는다: SSH 세션에서 띄운
# Docker Desktop 은 접속이 끊길 때 함께 정리되므로(2026-09-10·09-14 실측,
# scripts/docker_watchdog.ps1 주석) 효과가 없다.
#
# 점검 회차: 2 — docker_watchdog.ps1 의 새 엔진 판정을 실물에서 검증한다.
#   끊긴 끝점은 '아무도 응답하지 않는 파이프'라서 실제 사고("Error response from daemon:
#   Docker Desktop is unable to start" — 파이프는 응답했고 백엔드가 오류를 돌려준 상태)와
#   같지 않다. 그래서 이 검증은 '새 판정이 끊긴 엔진을 실패로 본다'까지만 증명하고,
#   옛 판정이 그날 실제로 오판했는지는 증명하지 않는다. 엔진이 복구돼 재현이 불가능하다.

on:
  push:
    branches:
      - claude/nifty-brahmagupta-z0jsdk
    paths:
      - .github/workflows/minipc-diag.yml

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify engine liveness judgement on Mini PC
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          PORT: ${{ secrets.PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          cat > d.ps1 <<'EOF'
          $ErrorActionPreference='Continue'; $ProgressPreference='SilentlyContinue'
          [Console]::OutputEncoding=[Text.Encoding]::UTF8
          $docker = 'C:\Program Files\Docker\Docker\resources\bin\docker.exe'
          $root = Join-Path $env:TEMP 'namu_engine_check'
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          # 고친 docker_watchdog.ps1 의 Test-Engine 과 같은 판정.
          function Judge-New($dh) {
            $o = Join-Path $root 'n.out'; $e = Join-Path $root 'n.err'
            Remove-Item $o, $e -Force -EA 0
            $prev = $env:DOCKER_HOST
            if ($dh) { $env:DOCKER_HOST = $dh }
            try {
              $p = Start-Process -FilePath $docker -ArgumentList 'version','--format','{{.Server.Version}}' `
                     -NoNewWindow -PassThru -RedirectStandardOutput $o -RedirectStandardError $e
              $null = $p.Handle
              if (-not $p.WaitForExit(30000)) { try { $p.Kill() } catch {}; return '응답없음 · 30초 초과' }
              $ver = ''
              if (Test-Path $o) { $ver = ((Get-Content $o -Raw -EA 0) -replace '\s','') }
              if ($p.ExitCode -ne 0) {
                $d = ''
                if (Test-Path $e) {
                  $f = (Get-Content $e -EA 0 | Where-Object { $_ -match '\S' } | Select-Object -First 1)
                  if ($f) { $d = ([string]$f).Trim() }
                }
                $r = '응답없음 · 종료코드 ' + $p.ExitCode
                if ($d) { $r += (' · ' + $d) }
                return $r
              }
              if ($ver -notmatch '^\d+\.\d+') { return ('응답없음 · 종료코드 0 이지만 버전 비정상: "' + $ver + '"') }
              return ('응답OK · 서버 버전 ' + $ver)
            } finally { $env:DOCKER_HOST = $prev }
          }

          # 옛 판정 — docker info 의 종료코드만 본다.
          function Judge-Old($dh) {
            $o = Join-Path $root 'o.out'; $e = Join-Path $root 'o.err'
            Remove-Item $o, $e -Force -EA 0
            $prev = $env:DOCKER_HOST
            if ($dh) { $env:DOCKER_HOST = $dh }
            try {
              $p = Start-Process -FilePath $docker -ArgumentList 'info','--format','{{.ServerVersion}}' `
                     -NoNewWindow -PassThru -RedirectStandardOutput $o -RedirectStandardError $e
              $null = $p.Handle
              if (-not $p.WaitForExit(30000)) { try { $p.Kill() } catch {}; return '응답없음 · 30초 초과' }
              $out = ''
              if (Test-Path $o) { $out = ((Get-Content $o -Raw -EA 0) -replace '\s','') }
              $verdict = $(if ($p.ExitCode -eq 0) { '응답OK' } else { '응답없음' })
              return ($verdict + ' · 종료코드 ' + $p.ExitCode + ' · 받은출력 "' + $out + '"')
            } finally { $env:DOCKER_HOST = $prev }
          }

          $dead = 'npipe:////./pipe/namu_no_such_engine'

          '########## 1. 살아 있는 엔진 (기본 끝점) — 둘 다 OK 여야 한다'
          '  새 판정: ' + (Judge-New $null)
          '  옛 판정: ' + (Judge-Old $null)

          '########## 2. 끊긴 끝점 — 새 판정은 반드시 응답없음 이어야 한다'
          '  새 판정: ' + (Judge-New $dead)
          '  옛 판정: ' + (Judge-Old $dead)

          '########## 3. 현재 서비스 상태'
          (& $docker ps --format '{{.Names}} | {{.Status}}' 2>&1 | Out-String).Trim()

          '########## 4. watchdog 로그 최근 8줄'
          $wl = Join-Path $env:USERPROFILE 'docker_watchdog\watchdog.log'
          if (Test-Path $wl) { Get-Content $wl -Tail 8 } else { '로그 파일 없음' }

          Remove-Item $root -Recurse -Force -EA 0
          EOF

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          b64=$(iconv -f UTF-8 -t UTF-16LE d.ps1 | base64 -w0)

          ok=0
          for i in $(seq 1 24); do
            if ssh -i ~/.ssh/k -p "$PORT" \
                   -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                   -o ConnectTimeout=15 -o LogLevel=ERROR "$USERNAME@$HOST" \
                   "powershell -NoProfile -NonInteractive -EncodedCommand $b64"; then
              ok=1; break
            fi
            echo "--- SSH 시도 $i 실패 — 15초 후 재시도"
            sleep 15
          done
          rm -f ~/.ssh/k

          if [ "$ok" -ne 1 ]; then
            echo "::error::6분 동안 SSH 접속 실패 — 미니PC 응답 없음"
            exit 1
          fi
