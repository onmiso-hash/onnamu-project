name: Mini PC diagnosis (read-only)

# 2026-10-15 다운 조치용 점검. 작업 브랜치에 푸시할 때만 돈다 — main 배포(deploy.yml)는 건드리지 않는다.
#
# 왜 필요한가: 2026-10-14 01:20~06:25 KST 사이 Docker Desktop 엔진이 죽어 컨테이너 12개가
# 전부 내려갔고(네 도메인 530 = 터널에 오리진 0개) 18시간 넘게 복구되지 않았다. 웹 세션에는
# ssh 바이너리도 키도 없고 프록시가 onnamu.kr 을 막으므로, 미니PC 상태를 보는 길은 이 경로뿐이다.
#
# 미니PC에서는 읽기만 한다. 고치는 동작(도커 재시작 등)은 넣지 않는다: SSH 세션에서 띄운
# Docker Desktop 은 접속이 끊길 때 함께 정리되므로(2026-09-10·09-14 실측,
# scripts/docker_watchdog.ps1 주석) 효과가 없다.
#
# 점검 회차: 6 — CPU 사용률이 높다는 신고. 무엇이 먹고 있는지 본다.
#
#   첫 용의자는 어제(#17) 바꾼 감시 판정이다. 새 판정이 멀쩡한 엔진을 실패로 오판하면
#   watchdog 이 연속 2회 뒤 Docker Desktop 을 죽이고 다시 띄우며, 10분 냉각을 두고
#   이것을 반복한다 — 약 13분 주기로 도커가 재시작되면 CPU 를 계속 먹는다. 그래서
#   watchdog.log 와 state.json, Docker Desktop 프로세스의 시작 시각을 먼저 본다.
#
#   그 다음 일반 용의자 — 프로세스별 현재 CPU%, 컨테이너별 CPU(docker stats),
#   컨테이너 재시작 횟수, Windows 쪽 사건(업데이트·백신 검사).

on:
  push:
    branches:
      - claude/nifty-brahmagupta-z0jsdk
    paths:
      - .github/workflows/minipc-diag.yml
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: What is eating the CPU
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          PORT: ${{ secrets.PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          cat > d.ps1 <<'EOF'
          $ErrorActionPreference='Continue'; $ProgressPreference='SilentlyContinue'
          [Console]::OutputEncoding=[Text.Encoding]::UTF8
          $docker = 'C:\Program Files\Docker\Docker\resources\bin\docker.exe'
          $wdRoot = Join-Path $env:USERPROFILE 'docker_watchdog'

          '########## 0. 기본'
          $cs = Get-CimInstance Win32_ComputerSystem
          $os = Get-CimInstance Win32_OperatingSystem
          ('  논리 코어 수: ' + $cs.NumberOfLogicalProcessors + '  (프로세스 CPU% 는 코어 합산이라 100 을 넘을 수 있다)')
          ('  마지막 부팅  : ' + $os.LastBootUpTime + '  가동 ' + ((Get-Date) - $os.LastBootUpTime).ToString('d\.hh\:mm\:ss'))
          ('  메모리 여유  : ' + [math]::Round($os.FreePhysicalMemory/1MB,1) + 'GB / ' +
                                 [math]::Round($cs.TotalPhysicalMemory/1GB,1) + 'GB')

          '########## 1. 감시가 도커를 반복 재시작하고 있는가  ← 어제 바꾼 판정이 첫 용의자'
          $wl = Join-Path $wdRoot 'watchdog.log'
          if (Test-Path $wl) {
            '--- watchdog.log 최근 30줄 ---'
            Get-Content $wl -Tail 30
            $recent = Get-Content $wl | Where-Object { $_ -match '^2026-10-15' }
            ('--- 오늘(10-15) 줄 수: ' + @($recent).Count)
            ('--- 오늘 "다시 띄운다" 횟수: ' + @($recent | Where-Object { $_ -match '다시 띄운다' }).Count)
            '    → 0 이면 감시는 무죄다. 여러 번이면 판정 오판으로 재시작을 반복하는 것이다'
          } else { '  watchdog.log 없음' }
          $sf = Join-Path $wdRoot 'state.json'
          if (Test-Path $sf) { ('  state.json: ' + ((Get-Content $sf -Raw) -replace '\s','')) }
          $io = Join-Path $wdRoot 'info.out'
          $ie = Join-Path $wdRoot 'info.err'
          if (Test-Path $io) { ('  info.out ' + (Get-Item $io).LastWriteTime + ' = "' + ((Get-Content $io -Raw -EA 0) -replace '\s','') + '"') }
          if (Test-Path $ie) { ('  info.err ' + (Get-Item $ie).LastWriteTime + ' = "' + ((Get-Content $ie -Raw -EA 0) -replace '\s','') + '"') }
          (Get-ScheduledTaskInfo -TaskName NamuDockerWatchdog |
             Select-Object LastRunTime, LastTaskResult, NextRunTime | Format-List | Out-String).Trim()

          '########## 2. Docker Desktop 프로세스 시작 시각 (최근이면 방금 재시작된 것)'
          (Get-Process 'Docker Desktop','com.docker.backend','com.docker.build','vmmem','vmmemWSL','wslservice' -EA 0 |
             Select-Object Name, Id, StartTime,
               @{n='CPU초';e={[math]::Round($_.CPU)}},
               @{n='WS_MB';e={[math]::Round($_.WorkingSet64/1MB)}} |
             Sort-Object Name | Format-Table -AutoSize | Out-String).Trim()

          '########## 3. 전체 CPU (2초 간격 3회)'
          try {
            (Get-Counter '\Processor(_Total)\% Processor Time' -SampleInterval 2 -MaxSamples 3 -EA Stop).CounterSamples |
              ForEach-Object { '  ' + [math]::Round($_.CookedValue,1) + '%' }
          } catch { '  Get-Counter 실패: ' + $_.Exception.Message
                    ('  Win32_Processor LoadPercentage: ' +
                      ((Get-CimInstance Win32_Processor | Measure-Object -Property LoadPercentage -Average).Average) + '%') }

          '########## 4. 프로세스별 현재 CPU% 상위 15'
          (Get-CimInstance Win32_PerfFormattedData_PerfProc_Process |
             Where-Object { $_.Name -ne '_Total' -and $_.Name -ne 'Idle' } |
             Sort-Object PercentProcessorTime -Descending | Select-Object -First 15 |
             Select-Object @{n='이름';e={$_.Name}}, @{n='PID';e={$_.IDProcess}},
                           @{n='CPU%';e={$_.PercentProcessorTime}},
                           @{n='WS_MB';e={[math]::Round($_.WorkingSetPrivate/1MB)}} |
             Format-Table -AutoSize | Out-String).Trim()

          '########## 5. 컨테이너별 CPU·메모리'
          (& $docker stats --no-stream --format '{{.Name}} | CPU {{.CPUPerc}} | MEM {{.MemUsage}} ({{.MemPerc}})' 2>&1 | Out-String).Trim()

          '########## 6. 컨테이너 재시작 횟수 (재시작 루프 찾기)'
          $names = & $docker ps -a --format '{{.Names}}' 2>&1
          foreach ($n in $names) {
            if ($n -and $n -notmatch 'Error|error') {
              $rc = & $docker inspect -f '{{.RestartCount}}|{{.State.Status}}|{{.State.StartedAt}}' $n 2>&1
              ('  ' + $n + ' → 재시작 ' + $rc)
            }
          }

          '########## 7. 윈도우 쪽 사건 (최근 6시간) — 업데이트·백신'
          try {
            Get-WinEvent -FilterHashtable @{ LogName='System'; StartTime=(Get-Date).AddHours(-6);
                                             Id=@(1074,6005,6006,19,43,44,41) } -EA Stop |
              Sort-Object TimeCreated |
              ForEach-Object { '  ' + $_.TimeCreated.ToString('MM-dd HH:mm:ss') + ' [' + $_.Id + '] ' +
                               (($_.Message -split "`n")[0]).Trim() } |
              Select-Object -First 25
          } catch { '  해당 사건 없음 또는 조회 실패' }
          EOF

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          b64=$(iconv -f UTF-8 -t UTF-16LE d.ps1 | base64 -w0)

          ok=0
          for i in $(seq 1 12); do
            if ssh -i ~/.ssh/k -p "$PORT" \
                   -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                   -o ConnectTimeout=15 -o LogLevel=ERROR "$USERNAME@$HOST" \
                   "powershell -NoProfile -NonInteractive -EncodedCommand $b64"; then
              ok=1; break
            fi
            echo "--- SSH 시도 $i 실패 — 15초 후 재시도"
            sleep 15
          done
          rm -f ~/.ssh/k

          if [ "$ok" -ne 1 ]; then
            echo "::error::SSH 접속 실패 — 미니PC 응답 없음"
            exit 1
          fi
