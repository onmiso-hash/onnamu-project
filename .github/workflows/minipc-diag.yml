name: Mini PC diagnosis (read-only)

# 2026-10-15 다운 조치용 점검. 작업 브랜치에 푸시할 때만 돈다 — main 배포(deploy.yml)는 건드리지 않는다.
#
# 왜 필요한가: 2026-10-14 01:20~06:25 KST 사이 Docker Desktop 엔진이 죽어 컨테이너 12개가
# 전부 내려갔고(네 도메인 530 = 터널에 오리진 0개) 18시간 넘게 복구되지 않았다. 웹 세션에는
# ssh 바이너리도 키도 없고 프록시가 onnamu.kr 을 막으므로, 미니PC 상태를 보는 길은 이 경로뿐이다.
#
# 미니PC에서는 읽기만 한다. 고치는 동작(도커 재시작 등)은 넣지 않는다: SSH 세션에서 띄운
# Docker Desktop 은 접속이 끊길 때 함께 정리되므로(2026-09-10·09-14 실측,
# scripts/docker_watchdog.ps1 주석) 효과가 없다.
#
# 점검 회차: 3 — 감시가 그 20시간 동안 실제로 돌았는지 예약작업 이력에서 확인한다.
#   회차 2에서 끊긴 끝점에는 옛 판정도 종료코드 1 로 제대로 실패했다. 즉 '종료코드만
#   보아 오판했다'는 가설은 지지되지 않았다. 남은 설명은 둘이다 — ① 파이프가 응답하고
#   백엔드만 오류를 돌려주는 'unable to start' 상태에서는 docker info 가 0 으로 끝났다
#   (재현 불가, 미검증) ② 감시가 그 20시간 동안 아예 돌지 않았다. ②는 예약작업 이력으로
#   가를 수 있으므로 그것을 본다.

on:
  push:
    branches:
      - claude/nifty-brahmagupta-z0jsdk
    paths:
      - .github/workflows/minipc-diag.yml

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Was the watchdog running during the outage window
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          PORT: ${{ secrets.PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          cat > d.ps1 <<'EOF'
          $ErrorActionPreference='Continue'; $ProgressPreference='SilentlyContinue'
          [Console]::OutputEncoding=[Text.Encoding]::UTF8

          $from = [datetime]'2026-10-14 00:00:00'
          $to   = [datetime]'2026-10-15 01:00:00'

          '########## 1. 예약작업 이력 — 감시가 돌았는가'
          $log = 'Microsoft-Windows-TaskScheduler/Operational'
          try {
            $cfg = Get-WinEvent -ListLog $log -EA Stop
            ('로그 사용: ' + $cfg.IsEnabled + ' · 보관 ' + [math]::Round($cfg.FileSize/1MB,1) + 'MB · 최대 ' + [math]::Round($cfg.MaximumSizeInBytes/1MB,1) + 'MB')
            if (-not $cfg.IsEnabled) { '→ 이 로그가 꺼져 있어 이력을 알 수 없다 (판정 불가)' }
            else {
              $ev = Get-WinEvent -FilterHashtable @{ LogName=$log; StartTime=$from; EndTime=$to } -EA Stop |
                      Where-Object { $_.Message -match 'NamuDockerWatchdog' }
              ('창 안의 NamuDockerWatchdog 사건 수: ' + @($ev).Count)
              if (@($ev).Count -gt 0) {
                '--- 시간대별 건수 (감시는 3분마다라 정상이면 시간당 약 20건) ---'
                ($ev | Group-Object { $_.TimeCreated.ToString('MM-dd HH시') } |
                   Sort-Object Name | ForEach-Object { '  ' + $_.Name + ' : ' + $_.Count + '건' })
                '--- 가장 이른/늦은 사건 ---'
                ('  처음: ' + (($ev | Sort-Object TimeCreated | Select-Object -First 1).TimeCreated))
                ('  마지막: ' + (($ev | Sort-Object TimeCreated | Select-Object -Last 1).TimeCreated))
              }
            }
          } catch { '예약작업 이력 조회 실패: ' + $_.Exception.Message }

          '########## 2. 그 시간대에 윈도우가 재시작/업데이트를 했는가'
          try {
            Get-WinEvent -FilterHashtable @{ LogName='System'; StartTime=$from; EndTime=$to;
                                             Id=@(1074,1076,6005,6006,6008,41,43,44,19) } -EA Stop |
              Sort-Object TimeCreated |
              ForEach-Object { '  ' + $_.TimeCreated.ToString('MM-dd HH:mm:ss') + ' [' + $_.Id + '] ' +
                               (($_.Message -split "`n")[0]).Trim() } |
              Select-Object -First 40
          } catch { 'System 로그 조회 실패 또는 해당 사건 없음: ' + $_.Exception.Message }

          '########## 3. 로그인 세션 (예약작업이 Interactive 로 등록돼 있다)'
          (query user 2>&1 | Out-String).Trim()
          ('현재 콘솔 세션 사용자: "' + ((Get-CimInstance Win32_ComputerSystem).UserName) + '"')

          '########## 4. 예약작업 등록 상태'
          (Get-ScheduledTask -TaskName NamuDockerWatchdog |
             Select-Object State, @{n='LogonType';e={$_.Principal.LogonType}},
                                 @{n='UserId';e={$_.Principal.UserId}} |
             Format-List | Out-String).Trim()
          EOF

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          b64=$(iconv -f UTF-8 -t UTF-16LE d.ps1 | base64 -w0)

          ok=0
          for i in $(seq 1 24); do
            if ssh -i ~/.ssh/k -p "$PORT" \
                   -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                   -o ConnectTimeout=15 -o LogLevel=ERROR "$USERNAME@$HOST" \
                   "powershell -NoProfile -NonInteractive -EncodedCommand $b64"; then
              ok=1; break
            fi
            echo "--- SSH 시도 $i 실패 — 15초 후 재시도"
            sleep 15
          done
          rm -f ~/.ssh/k

          if [ "$ok" -ne 1 ]; then
            echo "::error::6분 동안 SSH 접속 실패 — 미니PC 응답 없음"
            exit 1
          fi
