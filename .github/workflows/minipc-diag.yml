name: Mini PC diagnosis (read-only)

# 2026-10-07 미니PC 10-05 정지(0x20001) 덤프 분석용 일회성 점검.
# 작업 브랜치에 푸시할 때만 돈다 — main 배포(deploy.yml)는 건드리지 않는다.
# 미니PC에서는 조회 명령만 실행한다. 이 저장소는 공개라 로그도 공개다:
# 프로세스 명령줄은 찍지 않는다(배포 중이면 -AskApiKey 값이 들어 있을 수 있다).
# 조사가 끝나면 이 파일은 브랜치에서 지운다.

on:
  push:
    branches:
      - claude/keen-gates-kynovp
    paths:
      - .github/workflows/minipc-diag.yml

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Write diagnosis scripts
        run: |
          mkdir -p diag
          cat > diag/1_dump.ps1 <<'EOF'
          $ErrorActionPreference='SilentlyContinue'; $ProgressPreference='SilentlyContinue'
          [Console]::OutputEncoding=[Text.Encoding]::UTF8
          '== A. 분석 도구(cdb.exe) 찾기'
          $c = @()
          $c += Get-Command cdb.exe -EA 0 | % { $_.Source }
          $c += Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe','C:\Program Files\Windows Kits\10\Debuggers\x64\cdb.exe' -EA 0 | % FullName
          $c += Get-ChildItem C:\Users\onmis -Filter cdb.exe -Recurse -Depth 7 -EA 0 | % FullName
          Get-ChildItem C:\ -Directory -EA 0 | ? { $_.Name -notin 'Windows','Users','ProgramData','$Recycle.Bin' } | % { Get-ChildItem $_.FullName -Filter cdb.exe -Recurse -Depth 5 -EA 0 | % FullName } | % { $c += $_ }
          $c = $c | ? { $_ } | Select-Object -Unique
          $c
          '== B. 심볼 폴더 후보'
          $s = @('C:\ProgramData\dbg\sym','C:\Symbols','C:\symbols') + (Get-ChildItem C:\Users\onmis -Directory -Recurse -Depth 4 -EA 0 | ? { $_.Name -match '^(sym|symbols|symcache)$' } | % FullName)
          $s = $s | ? { Test-Path $_ } | Select-Object -Unique
          $s | % { '{0}  {1}MB' -f $_,[int]((Get-ChildItem $_ -Recurse -File -EA 0 | Measure-Object Length -Sum).Sum/1MB) }
          $cdb = $c | ? { $_ -match 'x64|amd64' } | Select-Object -First 1
          if (-not $cdb) { $cdb = $c | Select-Object -First 1 }
          if (-not $cdb) { 'cdb.exe 없음 — 분석 중단'; exit 0 }
          $cache = $s | Select-Object -First 1
          if (-not $cache) { $cache = 'C:\ProgramData\dbg\sym' }
          $sym = 'srv*' + $cache + '*https://msdl.microsoft.com/download/symbols'
          'cdb=' + $cdb + '  cache=' + $cache
          foreach ($f in 'C:\Windows\Minidump\100526-11203-01.dmp','C:\Windows\Minidump\082626-7140-01.dmp') {
            '########## ' + $f
            & $cdb -z $f -y $sym -c '.bugcheck; vertarget; kn 20; !analyze -v; q' 2>&1 |
              ? { $_ -notmatch '^\s*$' -and $_ -notmatch 'DBGHELP|SYMSRV|Loading|\*\*\*\*\*\*' } |
              Select-Object -First 140
          }
          EOF

      - name: Run on Mini PC
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          PORT: ${{ secrets.PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          for f in diag/*.ps1; do
            echo "########## $f"
            b64=$(iconv -f UTF-8 -t UTF-16LE "$f" | base64 -w0)
            ssh -i ~/.ssh/k -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                -o ConnectTimeout=20 -o LogLevel=ERROR "$USERNAME@$HOST" \
                "powershell -NoProfile -NonInteractive -EncodedCommand $b64" || echo "(exit $?)"
          done
          rm -f ~/.ssh/k
