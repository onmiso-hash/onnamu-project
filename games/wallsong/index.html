    <style>html,body{touch-action:none;background:#141821;height:100%;margin:0;overflow:hidden}#game{width:100vw;height:100dvh}#rotate{z-index:10;color:#f3e6c4;text-align:center;background:#141821;flex-direction:column;justify-content:center;align-items:center;gap:16px;font:600 20px/1.6 system-ui,sans-serif;display:none;position:fixed;inset:0}#rotate .phone{border:4px solid #e0b851;border-radius:10px;width:48px;height:80px;animation:2s ease-in-out infinite turn}@keyframes turn{0%,30%{transform:rotate(0)}60%,to{transform:rotate(-90deg)}}body.portrait #rotate{display:flex}#loading{z-index:5;color:#f3e6c4;background:#141821;flex-direction:column;justify-content:center;align-items:center;gap:22px;font:600 18px/1.6 system-ui,sans-serif;transition:opacity .3s;display:flex;position:fixed;inset:0}#loading.done{opacity:0;pointer-events:none}#loading h1{text-shadow:0 4px 12px #000;margin:0;font:400 clamp(40px,9vw,84px)/1.1 Nanum Myeongjo,serif}#loading .bar{background:#2b3342;border-radius:4px;width:min(320px,60vw);height:8px;overflow:hidden}#loading .bar i{background:#e0b851;border-radius:4px;width:35%;height:100%;animation:1.2s ease-in-out infinite slide;display:block}#loading .sub{color:#9aa3b5;font-size:16px}@keyframes slide{0%{transform:translate(-100%)}to{transform:translate(290%)}}</style>
