<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>2048 Game</title>
    <style>
        body { background: #0f172a; color: white; font-family: 'Pretendard', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .grid { background: #1e293b; border-radius: 8px; padding: 10px; display: grid; grid-template-columns: repeat(4, 80px); grid-template-rows: repeat(4, 80px); gap: 10px; }
        .cell { background: rgba(255, 255, 255, 0.05); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; }
        .cell[data-value="2"] { background: #eee4da; color: #776e65; }
        .cell[data-value="4"] { background: #ede0c8; color: #776e65; }
        .cell[data-value="8"] { background: #f2b179; color: white; }
        .cell[data-value="16"] { background: #f59563; color: white; }
        .cell[data-value="32"] { background: #f67c5f; color: white; }
        .cell[data-value="64"] { background: #f65e3b; color: white; }
        .cell[data-value="128"] { background: #edcf72; color: white; }
        .cell[data-value="256"] { background: #edcc61; color: white; }
        .cell[data-value="512"] { background: #edc850; color: white; }
        .cell[data-value="1024"] { background: #edc53f; color: white; }
        .cell[data-value="2048"] { background: #edc22e; color: white; }
        .header { margin-bottom: 20px; text-align: center; }
        .score { font-size: 24px; color: #38bdf8; }
        .back { margin-top: 20px; color: #94a3b8; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>2048</h1>
        <div class="score">Score: <span id="scoreVal">0</span></div>
    </div>
    <div class="grid" id="grid"></div>
    <a href="/" class="back">← Back to Lobby</a>

    <script>
        const gridElement = document.getElementById('grid');
        const scoreElement = document.getElementById('scoreVal');
        let board = Array(4).fill().map(() => Array(4).fill(0));
        let score = 0;

        function init() {
            for (let i = 0; i < 16; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                gridElement.appendChild(cell);
            }
            addRandom();
            addRandom();
            draw();
        }

        function addRandom() {
            let empty = [];
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (board[r][c] === 0) empty.push({r, c});
                }
            }
            if (empty.length > 0) {
                let {r, c} = empty[Math.floor(Math.random() * empty.length)];
                board[r][c] = Math.random() < 0.9 ? 2 : 4;
            }
        }

        function draw() {
            const cells = document.querySelectorAll('.cell');
            board.flat().forEach((val, i) => {
                cells[i].innerText = val === 0 ? '' : val;
                cells[i].setAttribute('data-value', val);
            });
            scoreElement.innerText = score;
        }

        function slide(row) {
            let filtered = row.filter(x => x !== 0);
            for (let i = 0; i < filtered.length - 1; i++) {
                if (filtered[i] === filtered[i+1]) {
                    filtered[i] *= 2;
                    score += filtered[i];
                    filtered.splice(i+1, 1);
                }
            }
            while (filtered.length < 4) filtered.push(0);
            return filtered;
        }

        function move(dir) {
            let oldBoard = JSON.stringify(board);
            if (dir === 'left' || dir === 'right') {
                for (let r = 0; r < 4; r++) {
                    let row = board[r];
                    if (dir === 'right') row.reverse();
                    row = slide(row);
                    if (dir === 'right') row.reverse();
                    board[r] = row;
                }
            } else {
                for (let c = 0; c < 4; c++) {
                    let col = [board[0][c], board[1][c], board[2][c], board[3][c]];
                    if (dir === 'down') col.reverse();
                    col = slide(col);
                    if (dir === 'down') col.reverse();
                    for (let r = 0; r < 4; r++) board[r][c] = col[r];
                }
            }
            if (oldBoard !== JSON.stringify(board)) {
                addRandom();
                draw();
                if (isGameOver()) alert("Game Over!");
            }
        }

        function isGameOver() {
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (board[r][c] === 0) return false;
                    if (r < 3 && board[r][c] === board[r+1][c]) return false;
                    if (c < 3 && board[r][c] === board[r][c+1]) return false;
                }
            }
            return true;
        }

        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') move('left');
            if (e.key === 'ArrowRight') move('right');
            if (e.key === 'ArrowUp') move('up');
            if (e.key === 'ArrowDown') move('down');
        });

        init();
    </script>
</body>
</html>
