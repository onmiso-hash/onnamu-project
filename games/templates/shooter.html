<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>1943 Retro Shooter</title>
    <style>
        body { background: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; color: white; font-family: 'Pretendard', sans-serif; overflow: hidden; }
        .game-container { position: relative; }
        canvas { border: 2px solid #38bdf8; background: #004466; box-shadow: 0 0 20px rgba(56, 189, 248, 0.2); }
        .info { margin-bottom: 20px; text-align: center; }
        .score { font-size: 24px; font-weight: bold; color: #38bdf8; }
        .back { margin-top: 20px; color: #94a3b8; text-decoration: none; font-size: 14px; }
        
        #startOverlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.8);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10;
        }
        .start-btn {
            padding: 15px 40px;
            font-size: 20px;
            background: #38bdf8;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: bold;
        }
        .start-btn:hover { background: #0ea5e9; }
        .controls { margin-top: 15px; font-size: 14px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="info">
        <h1>1943 Retro</h1>
        <div class="score">Score: <span id="scoreVal">0</span></div>
    </div>
    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div id="startOverlay">
            <button class="start-btn" onclick="startGame()">Mission Start</button>
            <div class="controls">Arrows to Move | Space to Shoot | Enter to Start</div>
        </div>
    </div>
    <a href="/" class="back">← Back to Lobby</a>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('scoreVal');
        const startOverlay = document.getElementById('startOverlay');

        let score = 0;
        let gameActive = false;
        let gameInterval = null;
        const keys = {};

        // Entities
        let player = { x: 180, y: 500, w: 40, h: 40, speed: 5 };
        const bullets = [];
        const enemies = [];
        const enemyBullets = [];
        const islands = [];
        const clouds = [];

        function startGame() {
            resetGame();
            gameActive = true;
            startOverlay.style.display = 'none';
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 1000 / 60);
        }

        function resetGame() {
            score = 0;
            scoreElement.innerText = score;
            player = { x: 180, y: 500, w: 40, h: 40, speed: 5 };
            bullets.length = 0;
            enemies.length = 0;
            enemyBullets.length = 0;
            islands.length = 0;
            clouds.length = 0;
            // Pre-spawn some islands
            for(let i=0; i<5; i++) {
                islands.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, size: 40 + Math.random()*60 });
            }
        }

        function spawnEnemy() {
            if (!gameActive || Math.random() > 0.03) return;
            enemies.push({
                x: Math.random() * (canvas.width - 40),
                y: -50,
                w: 30,
                h: 30,
                speed: 2 + Math.random() * 2,
                shootCooldown: 60 + Math.random() * 100
            });
        }

        function update() {
            if (!gameActive) return;

            // Movement
            if (keys['ArrowLeft'] && player.x > 0) player.x -= player.speed;
            if (keys['ArrowRight'] && player.x < canvas.width - player.w) player.x += player.speed;
            if (keys['ArrowUp'] && player.y > 0) player.y -= player.speed;
            if (keys['ArrowDown'] && player.y < canvas.height - player.h) player.y += player.speed;

            // Shooting
            if (keys['Space']) {
                if (bullets.length === 0 || bullets[bullets.length-1].y < player.y - 20) {
                    bullets.push({ x: player.x + player.w/2 - 2, y: player.y, w: 4, h: 12 });
                }
            }

            // Update Background (Islands & Clouds)
            if (Math.random() < 0.005) islands.push({ x: Math.random()*canvas.width, y: -100, size: 40 + Math.random()*60 });
            islands.forEach((isl, i) => {
                isl.y += 0.5;
                if (isl.y > canvas.height + 100) islands.splice(i, 1);
            });

            if (Math.random() < 0.01) clouds.push({ x: Math.random()*canvas.width, y: -50, w: 40+Math.random()*40, h: 20+Math.random()*20 });
            clouds.forEach((c, i) => {
                c.y += 1.5;
                if (c.y > canvas.height + 50) clouds.splice(i, 1);
            });

            // Update Bullets
            bullets.forEach((b, i) => {
                b.y -= 10;
                if (b.y < -20) bullets.splice(i, 1);
            });

            // Update Enemies
            spawnEnemy();
            enemies.forEach((en, i) => {
                en.y += en.speed;
                en.shootCooldown--;
                if (en.shootCooldown <= 0) {
                    enemyBullets.push({ x: en.x + en.w/2, y: en.y + en.h, w: 6, h: 6 });
                    en.shootCooldown = 100 + Math.random() * 100;
                }

                // Player-Enemy Collision
                if (rectIntersect(player.x, player.y, player.w, player.h, en.x, en.y, en.w, en.h)) {
                    gameOver();
                }

                // Bullet-Enemy Collision
                bullets.forEach((b, bi) => {
                    if (rectIntersect(b.x, b.y, b.w, b.h, en.x, en.y, en.w, en.h)) {
                        enemies.splice(i, 1);
                        bullets.splice(bi, 1);
                        score += 100;
                        scoreElement.innerText = score;
                    }
                });

                if (en.y > canvas.height + 50) enemies.splice(i, 1);
            });

            // Update Enemy Bullets
            enemyBullets.forEach((eb, i) => {
                eb.y += 4;
                if (rectIntersect(eb.x, eb.y, eb.w, eb.h, player.x, player.y, player.w, player.h)) {
                    gameOver();
                }
                if (eb.y > canvas.height + 10) enemyBullets.splice(i, 1);
            });
        }

        function rectIntersect(x1, y1, w1, h1, x2, y2, w2, h2) {
            return x2 < x1 + w1 && x2 + w2 > x1 && y2 < y1 + h1 && y2 + h2 > y1;
        }

        function gameOver() {
            gameActive = false;
            clearInterval(gameInterval);
            setTimeout(() => {
                alert("Mission Failed! Score: " + score);
                startOverlay.style.display = 'flex';
            }, 10);
        }

        function draw() {
            // Background
            ctx.fillStyle = '#004466'; // Ocean
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Islands
            ctx.fillStyle = '#22c55e44';
            islands.forEach(isl => {
                ctx.beginPath();
                ctx.arc(isl.x, isl.y, isl.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Player (P-38 style)
            ctx.fillStyle = '#cbd5e1'; // Silver
            // Main body
            ctx.fillRect(player.x + 15, player.y + 5, 10, 30);
            // Wings
            ctx.fillRect(player.x, player.y + 15, 40, 8);
            // Tail
            ctx.fillRect(player.x + 5, player.y + 35, 30, 4);
            // Twin Engines
            ctx.fillStyle = '#94a3b8';
            ctx.fillRect(player.x + 5, player.y + 10, 6, 25);
            ctx.fillRect(player.x + 29, player.y + 10, 6, 25);

            // Draw Enemies
            enemies.forEach(en => {
                ctx.fillStyle = '#ef4444'; // Red
                ctx.fillRect(en.x + 10, en.y, 10, 30);
                ctx.fillRect(en.x, en.y + 5, 30, 8);
                ctx.fillStyle = '#b91c1c';
                ctx.fillRect(en.x + 5, en.y + 25, 20, 4);
            });

            // Bullets
            ctx.fillStyle = '#fbbf24'; // Yellow
            bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

            // Enemy Bullets
            ctx.fillStyle = '#f87171'; // Light Red
            enemyBullets.forEach(eb => {
                ctx.beginPath();
                ctx.arc(eb.x, eb.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });

            // Clouds
            ctx.fillStyle = '#ffffff33';
            clouds.forEach(c => {
                ctx.beginPath();
                ctx.ellipse(c.x, c.y, c.w, c.h, 0, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function gameLoop() {
            update();
            draw();
        }

        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (!gameActive && e.key === 'Enter') {
                startGame();
            }
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        // Initial Draw
        resetGame();
        draw();
    </script>
</body>
</html>
