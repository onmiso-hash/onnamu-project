<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07101c">
<title>Night Grove - 밤의 숲</title>
<style>
:root {
    --bg: #0f172a;
    --glass: rgba(12, 22, 38, 0.78);
    --glass-border: rgba(148, 197, 255, 0.16);
    --text: #f8fafc;
    --sub: #94a3b8;
    --accent: #38bdf8;
    --leaf: #86efac;
    --gold: #fcd34d;
    --danger: #fb7185;
}
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #07101c; color: var(--text); touch-action: none; overscroll-behavior: none; }
canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 52%, rgba(2, 6, 16, 0.7) 100%); }
#hurt { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(244, 63, 94, 0.55) 100%); }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .4s ease;
    padding: calc(env(safe-area-inset-top) + 0px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 12px); }
#hud.on { opacity: 1; }
#xpbar { position: relative; height: 12px; margin: 8px 0 8px; border-radius: 999px; background: rgba(15, 23, 42, 0.8); border: 1px solid var(--glass-border); overflow: hidden; }
#xpfill { position: absolute; inset: 0; transform-origin: left center; transform: scaleX(0); background: linear-gradient(90deg, #22d3ee, #38bdf8 60%, #a5f3fc); box-shadow: 0 0 12px rgba(56, 189, 248, .7); transition: transform .15s ease-out; }
#lvl { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 10px; font-weight: 800; letter-spacing: .06em; color: #e0f2fe; text-shadow: 0 1px 2px #000; }
.hud-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.hud-left, .hud-right { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.hud-right { align-items: flex-end; }
.hud-center { text-align: center; flex: 0 0 auto; }
#timer { font-size: 26px; font-weight: 800; letter-spacing: .04em; font-variant-numeric: tabular-nums; text-shadow: 0 0 14px rgba(56, 189, 248, .55); }
#timer.final { color: var(--gold); text-shadow: 0 0 14px rgba(252, 211, 77, .7); }
#timerSub { font-size: 11px; color: var(--sub); margin-top: 1px; }
.back { pointer-events: auto; color: var(--sub); text-decoration: none; font-size: 12px; }
.back:hover { color: var(--text); }
#hpbar { position: relative; width: 170px; height: 14px; border-radius: 999px; background: rgba(15, 23, 42, .85); border: 1px solid rgba(251, 113, 133, .35); overflow: hidden; }
#hpfill { position: absolute; inset: 0; transform-origin: left center; background: linear-gradient(90deg, #e11d48, #fb7185); transition: transform .2s ease-out; }
#hptext { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; text-shadow: 0 1px 2px #000; font-variant-numeric: tabular-nums; }
.slots { display: flex; gap: 4px; flex-wrap: wrap; max-width: 220px; }
.slot { width: 30px; height: 36px; border-radius: 8px; background: rgba(15, 23, 42, .78); border: 1px solid var(--glass-border); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.slot img { width: 22px; height: 22px; }
.pips { display: flex; gap: 1px; }
.pips i { width: 4px; height: 3px; border-radius: 1px; background: rgba(148, 163, 184, .3); }
.pips i.on { background: var(--leaf); box-shadow: 0 0 4px var(--leaf); }
.slots.p .pips i.on { background: var(--gold); box-shadow: 0 0 4px var(--gold); }
#kills { font-size: 14px; font-weight: 700; color: #e2e8f0; font-variant-numeric: tabular-nums; }
.btns { display: flex; gap: 6px; }
.ibtn { pointer-events: auto; width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(15, 23, 42, .78); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: border-color .2s, transform .15s; }
.ibtn:hover { border-color: var(--accent); }
.ibtn:active { transform: scale(.94); }
.ibtn svg { width: 18px; height: 18px; }
#bossbar { position: absolute; left: 50%; top: calc(env(safe-area-inset-top) + 92px); transform: translate(-50%, -10px); width: min(520px, 76vw); opacity: 0; transition: opacity .5s ease, transform .5s cubic-bezier(.2, .9, .25, 1.15); text-align: center; }
#bossbar.on { opacity: 1; transform: translate(-50%, 0); }
#bossname { font-size: 13px; font-weight: 800; color: #fecdd3; letter-spacing: .08em; text-shadow: 0 0 10px rgba(244, 63, 94, .8); margin-bottom: 4px; }
#bossbar .track { height: 10px; border-radius: 999px; background: rgba(15, 23, 42, .85); border: 1px solid rgba(244, 63, 94, .45); overflow: hidden; }
#bossfill { height: 100%; transform-origin: left center; background: linear-gradient(90deg, #9f1239, #f43f5e, #fda4af); transition: transform .15s ease-out; }
#banner { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%) scale(.92); font-size: clamp(18px, 4vw, 28px); font-weight: 800; letter-spacing: .02em; white-space: nowrap; opacity: 0; transition: opacity .45s ease, transform .6s cubic-bezier(.2, .9, .25, 1.2); text-shadow: 0 0 18px rgba(0, 0, 0, .9), 0 0 24px rgba(56, 189, 248, .5); }
#banner.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
#banner.warn { color: #fecdd3; text-shadow: 0 0 18px rgba(0, 0, 0, .9), 0 0 24px rgba(244, 63, 94, .8); }

/* ---------- 화면(모달) ---------- */
.screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: calc(env(safe-area-inset-top) + 16px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 16px);
    background: rgba(3, 8, 18, .55); opacity: 0; visibility: hidden; transition: opacity .35s ease, visibility 0s linear .35s; overflow-y: auto; touch-action: pan-y; }
.screen.show { opacity: 1; visibility: visible; transition: opacity .35s ease, visibility 0s; }
.panel { width: 100%; max-width: 560px; margin: auto; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 24px; padding: 28px 24px; text-align: center;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, .6), 0 0 40px rgba(56, 189, 248, .08); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    transform: translateY(18px) scale(.97); transition: transform .5s cubic-bezier(.2, .9, .25, 1.15); }
.screen.show .panel { transform: none; }
.gtitle { font-size: clamp(34px, 8vw, 50px); font-weight: 800; letter-spacing: -.02em; background: linear-gradient(180deg, #ecfccb, #86efac 55%, #38bdf8); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 18px rgba(134, 239, 172, .35)); }
.gsub { color: var(--leaf); font-weight: 700; letter-spacing: .3em; margin-top: 2px; font-size: 14px; }
.story { color: #cbd5e1; margin: 18px 0 16px; line-height: 1.6; font-size: 15px; }
.controls { text-align: left; background: rgba(2, 6, 23, .45); border: 1px solid var(--glass-border); border-radius: 16px; padding: 12px 14px; font-size: 13px; color: var(--sub); line-height: 1.75; }
.controls b { color: #e2e8f0; display: inline-block; min-width: 52px; }
.best { margin: 14px 0 4px; font-size: 13px; color: var(--gold); }
.btn { pointer-events: auto; display: inline-flex; align-items: center; justify-content: center; min-width: 140px; padding: 13px 22px; border-radius: 14px; border: 1px solid var(--glass-border); background: rgba(30, 41, 59, .8); color: var(--text); font-size: 16px; font-weight: 700; cursor: pointer; text-decoration: none; transition: transform .15s, border-color .2s, box-shadow .2s; }
.btn:hover { border-color: var(--accent); box-shadow: 0 0 18px rgba(56, 189, 248, .25); }
.btn:active { transform: scale(.96); }
.btn.primary { background: linear-gradient(135deg, #22c55e, #0ea5e9); border-color: transparent; color: #04111d; box-shadow: 0 8px 24px rgba(34, 197, 94, .3); }
.brow { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
.link { display: inline-block; margin-top: 14px; color: var(--sub); text-decoration: none; font-size: 13px; }
.link:hover { color: var(--text); }
h2.mtitle { font-size: 28px; font-weight: 800; }
.msub { color: var(--sub); margin-top: 4px; font-size: 14px; }
#levelup .panel { max-width: 760px; }
#levelup h2 { color: #bae6fd; text-shadow: 0 0 18px rgba(56, 189, 248, .6); }
#levelup.chest h2 { color: var(--gold); text-shadow: 0 0 18px rgba(252, 211, 77, .6); }
#cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; }
@media (max-width: 640px) { #cards { grid-template-columns: 1fr; } .panel { padding: 22px 16px; } }
.card { position: relative; pointer-events: auto; cursor: pointer; text-align: left; border-radius: 18px; padding: 14px; border: 1px solid var(--glass-border); background: rgba(15, 23, 42, .85); color: var(--text); display: flex; flex-direction: column; gap: 8px;
    opacity: 0; transform: translateY(14px); transition: transform .45s cubic-bezier(.2, .9, .25, 1.2), opacity .35s ease, border-color .2s, box-shadow .2s; }
.screen.show .card { opacity: 1; transform: none; }
.screen.show .card:nth-child(2) { transition-delay: .06s, .06s, 0s, 0s; }
.screen.show .card:nth-child(3) { transition-delay: .12s, .12s, 0s, 0s; }
.card:hover, .card:focus-visible { border-color: var(--accent); box-shadow: 0 0 22px rgba(56, 189, 248, .25); outline: none; }
.card .chead { display: flex; align-items: center; gap: 10px; }
.card img { width: 44px; height: 44px; flex: 0 0 auto; border-radius: 12px; background: rgba(2, 6, 23, .6); border: 1px solid var(--glass-border); }
.card b { font-size: 16px; display: block; }
.tag { display: inline-block; margin-top: 2px; font-size: 11px; font-weight: 800; padding: 1px 8px; border-radius: 999px; background: rgba(56, 189, 248, .18); color: #7dd3fc; }
.tag.new { background: rgba(134, 239, 172, .18); color: var(--leaf); }
.tag.pas { background: rgba(252, 211, 77, .16); color: var(--gold); }
.card p { font-size: 13px; color: #cbd5e1; line-height: 1.5; }
.card .key { position: absolute; top: 10px; right: 12px; font-size: 11px; color: var(--sub); border: 1px solid var(--glass-border); border-radius: 6px; padding: 0 6px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 18px; }
@media (max-width: 480px) { .stats { grid-template-columns: repeat(2, 1fr); } }
.stat { background: rgba(2, 6, 23, .45); border: 1px solid var(--glass-border); border-radius: 14px; padding: 10px 6px; }
.stat span { display: block; font-size: 11px; color: var(--sub); }
.stat strong { font-size: 18px; font-variant-numeric: tabular-nums; }
.dmgtable { margin-top: 14px; text-align: left; display: flex; flex-direction: column; gap: 6px; }
.drow { display: grid; grid-template-columns: 24px 96px 1fr 64px; align-items: center; gap: 8px; font-size: 12px; }
.drow img { width: 22px; height: 22px; }
.drow .bar { height: 8px; border-radius: 999px; background: rgba(148, 163, 184, .15); overflow: hidden; }
.drow .bar i { display: block; height: 100%; background: linear-gradient(90deg, #22c55e, #38bdf8); border-radius: 999px; }
.drow em { font-style: normal; text-align: right; color: #e2e8f0; font-variant-numeric: tabular-nums; }
.newbest { color: var(--gold); font-weight: 800; margin-top: 10px; font-size: 14px; }
#end.win h2 { background: linear-gradient(180deg, #fef9c3, #fcd34d, #fb923c); -webkit-background-clip: text; background-clip: text; color: transparent; }
#end.lose h2 { color: #fecdd3; }
.nights { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
@media (max-width: 420px) { .nights { grid-template-columns: 1fr; } }
.ncard { pointer-events: auto; cursor: pointer; text-align: left; border-radius: 16px; padding: 12px 14px; border: 1px solid var(--glass-border); background: rgba(2, 6, 23, .45); color: var(--text); transition: border-color .2s, box-shadow .2s, opacity .2s; }
.ncard b { display: block; font-size: 15px; }
.ncard span { display: block; font-size: 12px; color: var(--sub); margin-top: 3px; line-height: 1.45; }
.ncard:hover { border-color: var(--accent); }
.ncard.sel { border-color: var(--accent); box-shadow: 0 0 18px rgba(56, 189, 248, .25); background: rgba(14, 40, 60, .6); }
.ncard.locked { opacity: .45; cursor: not-allowed; }
.ncard.locked:hover { border-color: var(--glass-border); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="vignette"></div>
<div id="hurt"></div>

<div id="hud">
    <div id="xpbar"><div id="xpfill"></div><span id="lvl">Lv 1</span></div>
    <div class="hud-row">
        <div class="hud-left">
            <a href="/" class="back">← 게임 목록</a>
            <div id="hpbar"><div id="hpfill"></div><span id="hptext">100 / 100</span></div>
            <div id="slotsW" class="slots"></div>
            <div id="slotsP" class="slots p"></div>
        </div>
        <div class="hud-center">
            <div id="timer">00:00</div>
            <div id="timerSub">새벽까지 10:00</div>
        </div>
        <div class="hud-right">
            <div class="btns">
                <button id="btnSound" class="ibtn" aria-label="소리 켜기/끄기"></button>
                <button id="btnPause" class="ibtn" aria-label="일시정지"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
            </div>
            <div id="kills">처치 0</div>
        </div>
    </div>
    <div id="bossbar"><div id="bossname"></div><div class="track"><div id="bossfill"></div></div></div>
    <div id="banner"></div>
</div>

<div id="title" class="screen show">
    <div class="panel">
        <div class="gtitle">Night Grove</div>
        <div class="gsub">밤의 숲</div>
        <p class="story">빛을 잃어 가는 숲, 작은 나무 정령이 새벽이 올 때까지 10분을 버텨야 합니다.</p>
        <div class="controls">
            <div><b>키보드</b>WASD·방향키로 이동 · P/ESC 일시정지 · 1/2/3 능력 선택</div>
            <div><b>터치</b>화면 아무 곳이나 누른 채 끌어서 이동</div>
            <div><b>공격</b>무기는 저절로 공격합니다. 경험치 보석을 모아 능력을 고르세요.</div>
        </div>
        <div class="nights">
            <button id="night0" class="ncard sel"><b>첫째 밤 · 밤의 숲</b><span>박쥐와 도깨비불, 그림자 고목이 깨어나는 숲</span></button>
            <button id="night1" class="ncard locked"><b>둘째 밤 · 안개 늪</b><span id="night1Desc">첫째 밤을 한 번 이기면 열립니다</span></button>
        </div>
        <div id="bestLine" class="best"></div>
        <div class="brow"><button id="btnStart" class="btn primary">시작</button></div>
        <a href="/" class="link">← 게임 목록</a>
    </div>
</div>

<div id="pause" class="screen">
    <div class="panel">
        <h2 class="mtitle">일시정지</h2>
        <p class="msub">숲이 숨을 고르고 있습니다</p>
        <div class="brow">
            <button id="btnResume" class="btn primary">계속하기</button>
            <button id="btnRestart" class="btn">처음부터</button>
            <a href="/" class="btn">게임 목록</a>
        </div>
    </div>
</div>

<div id="levelup" class="screen">
    <div class="panel">
        <h2 id="lvTitle" class="mtitle">레벨 업!</h2>
        <p id="lvSub" class="msub"></p>
        <div id="cards"></div>
    </div>
</div>

<div id="end" class="screen">
    <div class="panel">
        <h2 id="endTitle" class="mtitle"></h2>
        <p id="endSub" class="msub"></p>
        <div class="stats">
            <div class="stat"><span>생존 시간</span><strong id="stTime">0:00</strong></div>
            <div class="stat"><span>처치 수</span><strong id="stKills">0</strong></div>
            <div class="stat"><span>레벨</span><strong id="stLevel">1</strong></div>
            <div class="stat"><span>점수</span><strong id="stScore">0</strong></div>
        </div>
        <div id="newBest" class="newbest"></div>
        <div id="dmgTable" class="dmgtable"></div>
        <div class="brow">
            <button id="btnNext" class="btn primary" style="display:none">다음 밤으로</button>
            <button id="btnAgain" class="btn primary">다시 하기</button>
            <button id="btnPick" class="btn">밤 고르기</button>
            <a href="/" class="btn">게임 목록</a>
        </div>
    </div>
</div>

<script>
'use strict';
// =====================================================================
//  Night Grove (밤의 숲) — 10분 생존 액션
//  외부 이미지·글꼴·스크립트·네트워크 요청 없음. 모든 그림은 Canvas 2D로 그린다.
// =====================================================================

const TAU = Math.PI * 2;
const RUN_TIME = 600;
const MAX_ENEMIES = 350, MAX_PROJ = 260, MAX_EPROJ = 360, MAX_PARTS = 650, MAX_GEMS = 360, MAX_DMG = 80, MAX_BOLTS = 12, MAX_RINGS = 24;
const BASE_SPEED = 150, BASE_MAGNET = 70, BASE_HP = 100;
const SS = 2;          // 스프라이트 초과 해상도
const LS = 0.25;       // 조명 캔버스 해상도 비율

// ---------- 저장소 (모든 접근을 try/catch) ----------
const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 저장 불가 환경 무시 */ } }
};

// ---------- 결정적 해시 (지면 장식용) ----------
function hash3(x, y, z) {
    let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(z | 0, 1442695041)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function fmtTime(s) { s = Math.max(0, Math.floor(s)); const m = Math.floor(s / 60), r = s % 60; return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r; }

// =====================================================================
//  사운드 — Web Audio 합성 효과음
// =====================================================================
const Sound = {
    ctx: null, master: null, noiseBuf: null, drone: null, last: {}, gemCombo: 0, gemT: 0,
    muted: store.get('night_grove_muted', '0') === '1',
    init() {
        if (this.ctx) { if (this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) {} } return; }
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        try { this.ctx = new AC(); } catch (e) { this.ctx = null; return; }
        const comp = this.ctx.createDynamicsCompressor();
        comp.connect(this.ctx.destination);
        this.master = this.ctx.createGain();
        this.master.gain.value = this.muted ? 0 : 0.45;
        this.master.connect(comp);
        const len = Math.floor(this.ctx.sampleRate * 0.6);
        this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const d = this.noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    },
    ok(name, gap) {
        if (!this.ctx || this.muted) return false;
        const now = this.ctx.currentTime;
        if (gap && this.last[name] !== undefined && now - this.last[name] < gap) return false;
        this.last[name] = now;
        return true;
    },
    tone(f, f2, dur, type, vol, delay) {
        const c = this.ctx, t = c.currentTime + (delay || 0);
        const o = c.createOscillator(), g = c.createGain();
        o.type = type;
        o.frequency.setValueAtTime(f, t);
        if (f2 && f2 !== f) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(this.master);
        o.start(t); o.stop(t + dur + 0.03);
    },
    noise(dur, vol, freq, type, delay) {
        const c = this.ctx, t = c.currentTime + (delay || 0);
        const s = c.createBufferSource(); s.buffer = this.noiseBuf;
        const f = c.createBiquadFilter(); f.type = type || 'lowpass'; f.frequency.value = freq;
        const g = c.createGain();
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f); f.connect(g); g.connect(this.master);
        s.start(t); s.stop(t + dur + 0.03);
    },
    shoot() { if (this.ok('shoot', 0.08)) this.tone(900, 540, 0.07, 'triangle', 0.035); },
    hit() { if (this.ok('hit', 0.07)) this.noise(0.05, 0.045, 1900, 'bandpass'); },
    die() { if (this.ok('die', 0.05)) { this.tone(340, 90, 0.12, 'square', 0.022); this.noise(0.08, 0.035, 900); } },
    gem() {
        if (!this.ok('gem', 0.03)) return;
        const now = this.ctx.currentTime;
        if (now - this.gemT > 0.45) this.gemCombo = 0;
        this.gemT = now;
        const f = 620 * Math.pow(2, Math.min(this.gemCombo, 24) / 12);
        this.gemCombo++;
        this.tone(f, f * 1.01, 0.09, 'sine', 0.045);
    },
    nova() { if (this.ok('nova', 0.2)) { this.noise(0.28, 0.06, 2600, 'highpass'); this.tone(180, 60, 0.2, 'sine', 0.06); } },
    zap() { if (this.ok('zap', 0.09)) { this.tone(1500, 300, 0.09, 'sawtooth', 0.025); this.noise(0.06, 0.03, 4000, 'highpass'); } },
    throwS() { if (this.ok('throw', 0.12)) this.tone(300, 520, 0.1, 'triangle', 0.03); },
    pickup() { if (this.ok('pk', 0.06)) { this.tone(660, 1320, 0.16, 'sine', 0.06); this.tone(990, 1980, 0.16, 'sine', 0.03, 0.05); } },
    select() { if (this.ok('sel', 0.05)) this.tone(520, 780, 0.1, 'triangle', 0.05); },
    levelUp() { if (!this.ok('lv', 0.1)) return; const n = [523, 659, 784, 1047]; for (let i = 0; i < n.length; i++) this.tone(n[i], n[i], 0.2, 'triangle', 0.06, i * 0.07); },
    chest() { if (!this.ok('chest', 0.2)) return; const n = [392, 523, 659, 784, 1047, 1319]; for (let i = 0; i < n.length; i++) this.tone(n[i], n[i], 0.25, 'sine', 0.05, i * 0.06); },
    hurt() { if (this.ok('hurt', 0.12)) { this.tone(230, 70, 0.22, 'sawtooth', 0.05); this.noise(0.15, 0.06, 600); } },

    bossDie() { if (this.ok('bdie', 0.5)) { this.noise(1.2, 0.09, 700); this.tone(200, 40, 1.2, 'sawtooth', 0.06); } },
    victory() { if (!this.ctx || this.muted) return; const n = [523, 659, 784, 1047, 784, 1047, 1319, 1568]; for (let i = 0; i < n.length; i++) this.tone(n[i], n[i], 0.35, 'triangle', 0.06, i * 0.12); },
    gameOver() { if (!this.ctx || this.muted) return; const n = [392, 330, 262, 196]; for (let i = 0; i < n.length; i++) this.tone(n[i], n[i] * 0.97, 0.4, 'sine', 0.06, i * 0.22); },
    startDrone() {
        if (!this.ctx || this.drone) return;
        const c = this.ctx;
        const g = c.createGain(); g.gain.value = 0; g.connect(this.master);
        const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 300; f.connect(g);
        const o1 = c.createOscillator(); o1.type = 'sine'; o1.frequency.value = 55;
        const o2 = c.createOscillator(); o2.type = 'triangle'; o2.frequency.value = 82.6;
        const o3 = c.createOscillator(); o3.type = 'sine'; o3.frequency.value = 110.7;
        const oscs = [o1, o2, o3];
        for (let i = 0; i < oscs.length; i++) { oscs[i].connect(f); oscs[i].start(); }
        const lfo = c.createOscillator(); lfo.frequency.value = 0.07;
        const lg = c.createGain(); lg.gain.value = 0.007;
        lfo.connect(lg); lg.connect(g.gain); lfo.start();
        oscs.push(lfo);
        g.gain.setTargetAtTime(0.018, c.currentTime, 2);
        this.drone = { g: g, oscs: oscs };
    },
    stopDrone() {
        if (!this.drone || !this.ctx) return;
        const d = this.drone, t = this.ctx.currentTime;
        this.drone = null;
        d.g.gain.cancelScheduledValues(t);
        d.g.gain.setTargetAtTime(0, t, 0.4);
        for (let i = 0; i < d.oscs.length; i++) { try { d.oscs[i].stop(t + 2.5); } catch (e) {} }
    },
    setMuted(m) {
        this.muted = m;
        store.set('night_grove_muted', m ? '1' : '0');
        if (this.ctx && this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.45, this.ctx.currentTime, 0.05);
    }
};

const CELL = 48, HSIZE = 4096;
const cellHead = new Int32Array(HSIZE);
const cellNext = new Int32Array(MAX_ENEMIES + 16);
const qBuf = new Int32Array(MAX_ENEMIES + 16);
let qStamp = 1;
function hkey(cx, cy) { return (Math.imul(cx, 73856093) ^ Math.imul(cy, 19349663)) & (HSIZE - 1); }
function buildGrid() {
    cellHead.fill(-1);
    const n = Math.min(enemies.length, MAX_ENEMIES + 16);
    for (let i = 0; i < n; i++) {
        const e = enemies[i];
        const k = hkey(Math.floor(e.x / CELL), Math.floor(e.y / CELL));
        cellNext[i] = cellHead[k];
        cellHead[k] = i;
    }
}
// 반경 r 안에 몸이 걸치는 적의 인덱스를 qBuf에 담고 개수를 돌려준다
function query(x, y, r) {
    let n = 0;
    qStamp++;
    const x0 = Math.floor((x - r - 50) / CELL), x1 = Math.floor((x + r + 50) / CELL);
    const y0 = Math.floor((y - r - 50) / CELL), y1 = Math.floor((y + r + 50) / CELL);
    for (let cy = y0; cy <= y1; cy++) {
        for (let cx = x0; cx <= x1; cx++) {
            for (let i = cellHead[hkey(cx, cy)]; i !== -1; i = cellNext[i]) {
                const e = enemies[i];
                if (e.dead || e.hide || e.q === qStamp) continue;
                const dx = e.x - x, dy = e.y - y, rr = r + e.r;
                if (dx * dx + dy * dy <= rr * rr) { e.q = qStamp; qBuf[n++] = i; }
            }
        }
    }
    return n;
}

function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function mkSprite(w, h, draw) {
    const c = mkCanvas(Math.ceil(w * SS), Math.ceil(h * SS));
    const g = c.getContext('2d');
    g.setTransform(SS, 0, 0, SS, w * SS / 2, h * SS / 2);
    draw(g);
    return { c: c, w: w, h: h };
}
function flashOf(sp) {
    const c = mkCanvas(sp.c.width, sp.c.height);
    const g = c.getContext('2d');
    g.drawImage(sp.c, 0, 0);
    g.globalCompositeOperation = 'source-atop';
    g.fillStyle = '#ffffff';
    g.fillRect(0, 0, c.width, c.height);
    return { c: c, w: sp.w, h: sp.h };
}
function glowSp(rgb, size, a) {
    return mkSprite(size, size, (g) => {
        const r = size / 2;
        const gr = g.createRadialGradient(0, 0, 0, 0, 0, r);
        gr.addColorStop(0, 'rgba(' + rgb + ',' + a + ')');
        gr.addColorStop(0.3, 'rgba(' + rgb + ',' + (a * 0.45) + ')');
        gr.addColorStop(1, 'rgba(' + rgb + ',0)');
        g.fillStyle = gr;
        g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill();
    });
}

function shapeLeaf(g, len, wid, col, vein) {

    g.beginPath(); g.moveTo(-len * 0.9, 0); g.lineTo(len * 0.75, 0); g.stroke();
}
function shapeSeed(g, s) {
    g.fillStyle = '#ecfccb';
    g.beginPath(); g.ellipse(0, 0, s, s * 0.52, 0, 0, TAU); g.fill();
    g.fillStyle = '#65a30d';

    g.fillStyle = 'rgba(255,255,255,0.7)';

}
function shapeAcorn(g, s) {
    g.fillStyle = '#b45309';
    g.beginPath(); g.ellipse(0, s * 0.25, s * 0.72, s * 0.85, 0, 0, TAU); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.28)';
    g.beginPath(); g.ellipse(-s * 0.26, s * 0.15, s * 0.16, s * 0.42, 0, 0, TAU); g.fill();
    g.fillStyle = '#713f12';
    g.beginPath(); g.ellipse(0, -s * 0.35, s * 0.86, s * 0.46, 0, 0, TAU); g.fill();
    g.strokeStyle = '#a16207'; g.lineWidth = s * 0.08;
    for (let i = -1; i <= 1; i++) { g.beginPath(); g.moveTo(i * s * 0.35 - s * 0.2, -s * 0.7); g.lineTo(i * s * 0.35 + s * 0.2, -s * 0.05); g.stroke(); }
    g.strokeStyle = '#713f12'; g.lineWidth = s * 0.2; g.lineCap = 'round';
    g.beginPath(); g.moveTo(0, -s * 0.75); g.lineTo(s * 0.12, -s * 1.08); g.stroke();
}
function shapeHeart(g, s, col) {
    g.fillStyle = col;
    g.beginPath(); g.moveTo(0, s * 0.9);
    g.bezierCurveTo(-s * 1.35, 0, -s * 0.7, -s * 1.05, 0, -s * 0.35);
    g.bezierCurveTo(s * 0.7, -s * 1.05, s * 1.35, 0, 0, s * 0.9);
    g.fill();
    g.fillStyle = 'rgba(255,255,255,0.45)';
    g.beginPath(); g.ellipse(-s * 0.45, -s * 0.35, s * 0.2, s * 0.13, -0.6, 0, TAU); g.fill();
}
function shapeMagnet(g, s) {
    g.lineCap = 'butt';
    g.strokeStyle = '#ef4444'; g.lineWidth = s * 0.5;
    g.beginPath(); g.moveTo(-s * 0.6, -s * 0.7); g.lineTo(-s * 0.6, 0); g.arc(0, 0, s * 0.6, Math.PI, 0, true); g.lineTo(s * 0.6, -s * 0.7); g.stroke();
    g.strokeStyle = '#f1f5f9';
    g.beginPath(); g.moveTo(-s * 0.6, -s * 0.95); g.lineTo(-s * 0.6, -s * 0.62); g.moveTo(s * 0.6, -s * 0.95); g.lineTo(s * 0.6, -s * 0.62); g.stroke();
}
function shapeChest(g, s) {
    g.fillStyle = '#7c2d12'; g.fillRect(-s, -s * 0.35, s * 2, s * 1.1);
    g.fillStyle = '#9a3412'; g.beginPath(); g.moveTo(-s, -s * 0.35); g.quadraticCurveTo(0, -s * 1.2, s, -s * 0.35); g.closePath(); g.fill();
    g.fillStyle = '#fcd34d';
    g.fillRect(-s, -s * 0.42, s * 2, s * 0.16);

    g.fillRect(-s * 0.22, -s * 0.2, s * 0.44, s * 0.36);
    g.strokeStyle = '#fbbf24'; g.lineWidth = s * 0.08; g.strokeRect(-s, -s * 0.35, s * 2, s * 1.1);
}
function shapeBolt(g, s, col) {
    g.fillStyle = col;
    g.beginPath(); g.moveTo(s * 0.2, -s); g.lineTo(-s * 0.55, s * 0.12); g.lineTo(-s * 0.02, s * 0.12); g.lineTo(-s * 0.25, s); g.lineTo(s * 0.6, -s * 0.2); g.lineTo(s * 0.05, -s * 0.2); g.closePath(); g.fill();

function damageEnemy(e, amt, wid, kx, ky, kb, showNum) {
    if (e.dead) return;
    const dealt = Math.min(amt, e.hp);
    e.hp -= amt;
    e.flash = 0.1;
    G.dmgStat[wid] = (G.dmgStat[wid] || 0) + dealt;
    if (kb > 0 && e.kb > 0) { e.kx += kx * kb * e.kb; e.ky += ky * kb * e.kb; }
    if (showNum) dmgNum(e.x, e.y - e.r, amt, amt >= 40, false);
    Sound.hit();
    if (e.hp <= 0) killEnemy(e);
}
function killEnemy(e) {
    e.dead = true;
    G.kills++;
    const d = EDEF[e.type];
    G.score += Math.round((d.xp || 1) * 10 * (1 + G.t / 300));
    burst(e.x, e.y, d.pc, e.boss ? 60 : (e.type === T_GOLEM ? 14 : 7), e.boss ? 320 : 140, e.boss ? 3 : 1.6);
    Sound.die();
    if (d.mini) {
        G.score += 5000;
        dropPickup(2, e.x, e.y);
        for (let i = 0; i < 12; i++) { const a = i / 12 * TAU; dropGem(e.x + Math.cos(a) * 40, e.y + Math.sin(a) * 40, 10); }
        addRing(0, e.x, e.y, 10, 220, 0.8, 3, false);
        G.shake = Math.max(G.shake, 10);
        Sound.bossDie();
        banner(NIGHT.miniDown, false);
        if (G.boss === e) G.boss = null;
        return;
    }
    if (d.final) {
        G.score += 20000;
        addRing(0, e.x, e.y, 10, 600, 1.6, 1, false);
        G.shake = Math.max(G.shake, 16);
        Sound.bossDie();
        if (G.boss === e) G.boss = null;
        startEnding();
        return;
    }
    const xm = 1 + G.t / 900;
    dropGem(e.x, e.y, Math.max(1, Math.round(d.xp * xm)));
    const r = Math.random();
    if (r < (e.type === T_GOLEM ? 0.035 : 0.0035)) dropPickup(0, e.x, e.y);
    else if (r > 0.9985) dropPickup(1, e.x, e.y);
}
function hurtPlayer(dmg) {
    if (P.iframes > 0 || G.deathT > 0 || G.ending) return;
    P.hp -= dmg;
    P.iframes = 0.7;
    G.hurtFlash = 0.35;
    G.shake = Math.max(G.shake, 6);
    Sound.hurt();
    burst(P.x, P.y, 3, 6, 120, 1.4);
    if (P.hp <= 0) {
        P.hp = 0;
        G.deathT = 1.4;
        burst(P.x, P.y, 8, 40, 260, 2.4);
        burst(P.x, P.y, 0, 20, 200, 2);
        G.shake = 12;
    }
}
function startEnding() {
    G.ending = true;
    G.endT = 3.2;
    G.won = true;
    banner(NIGHT.winBanner, false);
    Sound.victory();
}

// =====================================================================
function ownedWeapon(id) { for (let i = 0; i < G.weapons.length; i++) if (G.weapons[i].id === id) return G.weapons[i]; return null; }
function nearestEnemy(x, y, maxD) {
    let best = null, bd = maxD * maxD;
    for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (e.dead || e.hide) continue;
        const dx = e.x - x, dy = e.y - y, d2 = dx * dx + dy * dy;
        if (d2 < bd) { bd = d2; best = e; }
    }
    return best;
}
const chainHit = new Int32Array(16);
function fireChain(w, L) {
    const D = WDEF.chain, dmg = D.dmg[L] * P.dmgMul, jumps = D.n[L], jr = 150 * P.areaMul;
    let cur = nearestEnemy(P.x, P.y, 340);
    if (!cur) return false;
    const b = boltFree.pop() || (bolts.length < MAX_BOLTS ? newBoltObj() : null);
    let px = P.x, py = P.y, hn = 0, pn = 0;
    if (b) { b.pts[pn++] = px; b.pts[pn++] = py; }
    for (let j = 0; j < jumps && cur; j++) {
        // 들쭉날쭉한 번개 선
        if (b) {
            for (let s = 1; s <= 3; s++) {
                const f = s / 4, ox = (Math.random() - 0.5) * 18, oy = (Math.random() - 0.5) * 18;
                if (pn < 156) { b.pts[pn++] = px + (cur.x - px) * f + ox; b.pts[pn++] = py + (cur.y - py) * f + oy; }
            }
            if (pn < 158) { b.pts[pn++] = cur.x; b.pts[pn++] = cur.y; }
        }
        chainHit[hn++] = cur.uid;
        px = cur.x; py = cur.y;
        burst(px, py, 4, 3, 90, 1.2);
        damageEnemy(cur, dmg, 'chain', 0, 0, 0, true);
        // 다음 대상
        const n = query(px, py, jr);
        let nb = null, nd = 1e9;
        for (let k = 0; k < n; k++) {
            const e = enemies[qBuf[k]];
            if (e.dead) continue;
            let used = false;
            for (let h = 0; h < hn; h++) if (chainHit[h] === e.uid) { used = true; break; }
            if (used) continue;
            const dx = e.x - px, dy = e.y - py, d2 = dx * dx + dy * dy;
            if (d2 < nd) { nd = d2; nb = e; }
        }
        cur = nb;
    }
    if (b) { b.n = pn >> 1; b.t = 0; b.dur = 0.18; bolts.push(b); }
    return true;
}
function fireNova(L) {
    const D = WDEF.nova, R = D.rad[L] * P.areaMul, dmg = D.dmg[L] * P.dmgMul;
    const n = query(P.x, P.y, R);
    for (let k = 0; k < n; k++) {
        const e = enemies[qBuf[k]];
        const dx = e.x - P.x, dy = e.y - P.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
        damageEnemy(e, dmg, 'nova', dx / d, dy / d, 260, true);
    }
    addRing(1, P.x, P.y, 12, R, 0.35, 5, true);
    G.shake = Math.max(G.shake, 2);
    Sound.nova();
}
function updateWeapons(dt) {
    for (let wi = 0; wi < G.weapons.length; wi++) {
        const w = G.weapons[wi], L = w.lvl - 1;
        switch (w.id) {
            case 'seed': {
                const D = WDEF.seed;
                w.t -= dt;
                if (w.t <= 0) {
                    const tgt = nearestEnemy(P.x, P.y, 560);
                    if (!tgt) { w.t = 0.1; break; }
                    w.t = D.cd[L] * P.cdMul;
                    const base = Math.atan2(tgt.y - P.y, tgt.x - P.x), n = D.n[L], spd = 430;
                    for (let i = 0; i < n; i++) {
                        const a = base + (i - (n - 1) / 2) * 0.13;
                        spawnProj(0, P.x, P.y, Math.cos(a) * spd, Math.sin(a) * spd, D.dmg[L] * P.dmgMul, D.pierce[L], 1.4, 6 * Math.sqrt(P.areaMul));
                    }
                    Sound.shoot();
                }
                break;
            }
            case 'leaf': {
                const D = WDEF.leaf, n = D.n[L], R = D.rad[L] * P.areaMul, lr = 11 * P.areaMul, dmg = D.dmg[L] * P.dmgMul;
                G.leafAng += D.spin[L] * dt;
                for (let i = 0; i < n; i++) {
                    const a = G.leafAng + i / n * TAU, lx = P.x + Math.cos(a) * R, ly = P.y + Math.sin(a) * R;
                    const m = query(lx, ly, lr);
                    for (let k = 0; k < m; k++) {
                        const e = enemies[qBuf[k]];
                        if (e.leafCd > 0) continue;
                        e.leafCd = 0.45;
                        const dx = e.x - P.x, dy = e.y - P.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
                        damageEnemy(e, dmg, 'leaf', dx / d, dy / d, 140, true);
                    }
                }
                break;
            }
            case 'nova': {
                const D = WDEF.nova;
                w.t -= dt;
                if (w.t2 > 0) { w.t2 -= dt; if (w.t2 <= 0) fireNova(L); }
                if (w.t <= 0) {
                    w.t = D.cd[L] * P.cdMul;
                    fireNova(L);
                    if (D.n[L] > 1) w.t2 = 0.3;
                }
                break;
            }
            case 'chain': {
                const D = WDEF.chain;
                w.t -= dt;
                if (w.t <= 0) {
                    let fired = false;
                    for (let b = 0; b < D.bolts[L]; b++) fired = fireChain(w, L) || fired;
                    if (fired) { w.t = D.cd[L] * P.cdMul; Sound.zap(); } else w.t = 0.15;
                }
                break;
            }
            case 'aura': {
                const D = WDEF.aura;
                w.t -= dt;
                if (w.t <= 0) {
                    w.t = 0.3;
                    const R = D.rad[L] * P.areaMul, dmg = D.dps[L] * 0.3 * P.dmgMul;
                    const n = query(P.x, P.y, R);
                    for (let k = 0; k < n; k++) {
                        const e = enemies[qBuf[k]];
                        e.slowT = 0.5; e.slow = D.slow[L];
                        damageEnemy(e, dmg, 'aura', 0, 0, 0, false);
                    }
                }
                break;
            }
            case 'acorn': {
                const D = WDEF.acorn;
                w.t -= dt;
                if (w.t <= 0) {
                    w.t = D.cd[L] * P.cdMul;
                    const tgt = nearestEnemy(P.x, P.y, 420);
                    const base = tgt ? Math.atan2(tgt.y - P.y, tgt.x - P.x) : Math.atan2(P.dirY, P.dirX);
                    const n = D.n[L];
                    for (let i = 0; i < n; i++) {
                        const a = base + (i - (n - 1) / 2) * 0.5, spd = 380;
                        const p = spawnProj(1, P.x, P.y, Math.cos(a) * spd, Math.sin(a) * spd, D.dmg[L] * P.dmgMul, 999, 4, 10 * D.size[L] * Math.sqrt(P.areaMul));
                        if (p) { p.range = D.range[L] * P.areaMul; p.size = D.size[L]; }
                    }
                    Sound.throwS();
                }
                break;
            }
        }
    }
}

function updatePlayer(dt) {

function rollChoices() {
    const cand = [];

        const id = WORDER[i], w = ownedWeapon(id), D = WDEF[id];
        if (w) { if (w.lvl < 5) cand.push({ kind: 'wup', id: id, w: 3, name: D.name, icon: id, tag: 'Lv ' + w.lvl + ' → ' + (w.lvl + 1), tagc: '', desc: D.desc[w.lvl] }); }

    }
    for (let i = 0; i < PORDER.length; i++) {
        const id = PORDER[i], lv = G.pass[id] || 0, D = PDEF[id];
        if (lv < 5) cand.push({ kind: 'pas', id: id, w: 1.8, name: D.name, icon: id, tag: lv === 0 ? '새 능력' : 'Lv ' + lv + ' → ' + (lv + 1), tagc: 'pas', desc: D.desc });
    }
    const out = [];

        for (let i = 0; i < cand.length; i++) { r -= cand[i].w; if (r <= 0) { pick = i; break; } }
        out.push(cand[pick]);
        cand.splice(pick, 1);
    }
    if (out.length < 3) out.push({ kind: 'heal', id: 'heal', name: '생명의 이슬', icon: 'heal', tag: '회복', tagc: 'new', desc: '체력을 40 회복한다' });

    if (out.length < 3) out.push({ kind: 'heal', id: 'heal', name: '생명의 이슬', icon: 'heal', tag: '회복', tagc: 'new', desc: '체력을 40 회복한다' });

        const f = p.life / p.max, s = p.size * 5 * (0.4 + f * 0.6);
        c.globalAlpha = f;
        c.drawImage(SPR.dots[p.col].c, p.x - s, p.y - s, s * 2, s * 2);
    }
    c.globalAlpha = 1;
    c.globalCompositeOperation = 'source-over';
    // 피해 숫자
    c.font = '800 13px Pretendard, sans-serif';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    for (let i = 0; i < MAX_DMG; i++) {
        const d = dmgNums[i];
        if (d.life <= 0) continue;
        c.globalAlpha = Math.min(1, d.life * 2.5);
        const sc = d.big ? 1.35 : 1;
        if (sc !== 1) { c.save(); c.translate(d.x, d.y); c.scale(sc, sc); c.translate(-d.x, -d.y); }
        c.fillStyle = 'rgba(2,6,23,0.85)'; c.fillText(d.s, d.x + 1, d.y + 1);
        c.fillStyle = d.heal ? '#86efac' : d.big ? '#fde68a' : '#f8fafc';
        c.fillText(d.s, d.x, d.y);
        if (sc !== 1) c.restore();
    }
    c.globalAlpha = 1;
}
const FF = [];
for (let i = 0; i < 34; i++) FF.push({ x: Math.random(), y: Math.random(), p: Math.random() * TAU, s: 0.5 + Math.random() * 0.8, z: 0.25 + Math.random() * 0.5 });
function drawScreenSpace(t) {
    const c = ctx;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.globalCompositeOperation = 'lighter';
    const fa = 1 - G.dawn * 0.85;
    for (let i = 0; i < FF.length; i++) {
        const f = FF[i];
        let x = (f.x * viewW - camX * zoom * f.z + Math.sin(t * 0.5 + f.p) * 24) % viewW; if (x < 0) x += viewW;
        let y = (f.y * viewH - camY * zoom * f.z + Math.cos(t * 0.4 + f.p * 2) * 18) % viewH; if (y < 0) y += viewH;
        c.globalAlpha = Math.max(0, (0.35 + 0.4 * Math.sin(t * 2 + f.p * 3)) * fa);
        const s = 12 * f.s;
        c.drawImage(SPR.firefly.c, x - s / 2, y - s / 2, s, s);
    }
    c.globalAlpha = 1;
    c.globalCompositeOperation = 'source-over';
    if (NIGHT.id === 1) {
        const fs = Math.max(viewW, viewH) * 0.7;
        c.globalAlpha = (0.16 + 0.22 * G.fogT) * (1 - G.dawn);
        for (let i = 0; i < 6; i++) {
            const f = FF[i];
            let x = (f.x * viewW * 1.4 - camX * zoom * 0.35 + t * 9 * (1 + f.s)) % (viewW * 1.4); if (x < 0) x += viewW * 1.4;
            let y = (f.y * viewH * 1.4 - camY * zoom * 0.35 + Math.sin(t * 0.2 + f.p) * 30) % (viewH * 1.4); if (y < 0) y += viewH * 1.4;
            c.drawImage(SPR.fogPuff.c, x - viewW * 0.2 - fs / 2, y - viewH * 0.2 - fs / 2, fs, fs * 0.6);
        }
        c.globalAlpha = 1;
    }
    // 가상 조이스틱
    if (joy.active && G.state === 'play') {
        c.globalAlpha = 0.5;
        c.strokeStyle = 'rgba(148,197,255,0.6)'; c.lineWidth = 2;
        c.fillStyle = 'rgba(15,23,42,0.35)';
        c.beginPath(); c.arc(joy.bx, joy.by, 52, 0, TAU); c.fill(); c.stroke();
        c.globalAlpha = 0.85;
        c.fillStyle = 'rgba(134,239,172,0.8)';
        c.beginPath(); c.arc(joy.bx + joy.dx * 52, joy.by + joy.dy * 52, 22, 0, TAU); c.fill();
        c.globalAlpha = 1;
    }
    // 새벽빛
    if (G.dawn > 0) {
        c.globalAlpha = G.dawn * 0.35;
        c.fillStyle = '#fde68a';
        c.fillRect(0, 0, viewW, viewH);
        c.globalAlpha = 1;
    }
}
function render() {
    const c = ctx, t = G.renderT;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.globalCompositeOperation = 'source-over';
    c.globalAlpha = 1;
    c.fillStyle = NIGHT.bg;
    c.fillRect(0, 0, viewW, viewH);
    let sx = 0, sy = 0;
    if (G.shake > 0) { sx = (Math.random() * 2 - 1) * G.shake; sy = (Math.random() * 2 - 1) * G.shake; }
    const vw = viewW / zoom, vh = viewH / zoom;
    camX = P.x - vw / 2 + sx; camY = P.y - vh / 2 + sy;
    const k = dpr * zoom;
    c.setTransform(k, 0, 0, k, -camX * k, -camY * k);
    drawGround(vw, vh);
    drawPuddles();
    drawEnemies(t);
    drawPlayer(t);
    drawLighting();
    drawAfterLight(t);
    drawScreenSpace(t);
}

// =====================================================================
//  입력
// =====================================================================
const keys = Object.create(null);
const joy = { active: false, id: -1, bx: 0, by: 0, dx: 0, dy: 0 };
function onKeyDown(e) {
    const code = e.code;
    if (code === 'ArrowUp' || code === 'ArrowDown' || code === 'ArrowLeft' || code === 'ArrowRight' || code === 'Space') e.preventDefault();
    Sound.init();
    if (G.state === 'levelup') {
        if (code === 'Digit1' || code === 'Numpad1') choose(0);
        else if (code === 'Digit2' || code === 'Numpad2') choose(1);
        else if (code === 'Digit3' || code === 'Numpad3') choose(2);
    }
    if (code === 'KeyP' || code === 'Escape') {
        if (G.state === 'play') setPause(true);
        else if (G.state === 'pause') setPause(false);
    }
    if (code === 'KeyM') { Sound.setMuted(!Sound.muted); refreshSoundBtn(); }
    if ((code === 'Enter' || code === 'Space') && !e.repeat) {
        if (G.state === 'title') startNight(G.night);
        else if (G.state === 'over' || G.state === 'win') startRun();
    }
    keys[code] = true;
}
function onKeyUp(e) { keys[e.code] = false; }
function onPointerDown(e) {
    Sound.init();
    if (G.state !== 'play' || joy.active) return;
    joy.active = true; joy.id = e.pointerId; joy.bx = e.clientX; joy.by = e.clientY; joy.dx = 0; joy.dy = 0;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
}
function onPointerMove(e) {
    if (!joy.active || e.pointerId !== joy.id) return;
    let dx = e.clientX - joy.bx, dy = e.clientY - joy.by;
    const d = Math.sqrt(dx * dx + dy * dy), R = 52;
    // 손가락이 멀리 가면 받침도 따라온다 (떠다니는 조이스틱)
    if (d > R * 1.6) { joy.bx += dx / d * (d - R * 1.6); joy.by += dy / d * (d - R * 1.6); dx = e.clientX - joy.bx; dy = e.clientY - joy.by; }
    const m = Math.min(1, Math.sqrt(dx * dx + dy * dy) / R), dd = Math.sqrt(dx * dx + dy * dy) || 1;
    joy.dx = dx / dd * (m < 0.12 ? 0 : m); joy.dy = dy / dd * (m < 0.12 ? 0 : m);
    e.preventDefault();
}
function onPointerUp(e) { if (e.pointerId === joy.id) { joy.active = false; joy.id = -1; joy.dx = 0; joy.dy = 0; } }

// =====================================================================
//  시작
// =====================================================================
let lastT = 0;
function frame(now) {
    requestAnimationFrame(frame);
    let dt = lastT ? (now - lastT) / 1000 : 0.016;
    lastT = now;
    if (!(dt >= 0)) dt = 0;
    if (dt > 0.05) dt = 0.05;
    G.renderT += dt;
    if (G.uiLock > 0) G.uiLock -= dt;
    if (G.state === 'play') update(dt);
    else if (G.state === 'title') { P.x += 22 * dt; P.y += 8 * dt; P.moving = true; P.dirX = 1; P.dirY = 0; }
    updateHud(dt);
    render();
}
function init() {
    buildSprites();
    buildIcons();
    resize();
    G.xpNext = xpNeed(1);
    selectNight(0);
    refreshSoundBtn();
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', resize);
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerup', onPointerUp);
    canvas.addEventListener('pointercancel', onPointerUp);
    document.addEventListener('visibilitychange', () => { if (document.hidden) setPause(true); });
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    $('btnStart').addEventListener('click', () => startNight(G.night));
    $('btnAgain').addEventListener('click', startRun);
    $('btnNext').addEventListener('click', () => startNight(1));
    $('btnPick').addEventListener('click', showTitle);
    $('night0').addEventListener('click', () => { selectNight(0); Sound.init(); Sound.select(); });
    $('night1').addEventListener('click', () => { if (swampOpen()) { selectNight(1); Sound.init(); Sound.select(); } });
    $('btnResume').addEventListener('click', () => setPause(false));
    $('btnRestart').addEventListener('click', () => { $('pause').classList.remove('show'); startRun(); });
    $('btnPause').addEventListener('click', () => { if (G.state === 'play') setPause(true); else if (G.state === 'pause') setPause(false); });
    $('btnSound').addEventListener('click', () => { Sound.init(); Sound.setMuted(!Sound.muted); refreshSoundBtn(); });
    requestAnimationFrame(frame);
}
init();
</script>
