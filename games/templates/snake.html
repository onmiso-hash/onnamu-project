<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Snake Game</title>
    <style>
        body { background: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; color: white; font-family: sans-serif; }
        .game-container { position: relative; }
        canvas { border: 2px solid #38bdf8; background: #1e293b; box-shadow: 0 0 20px rgba(56, 189, 248, 0.2); }
        .info { margin-bottom: 20px; text-align: center; }
        .score { font-size: 24px; font-weight: bold; color: #38bdf8; }
        .back { margin-top: 20px; color: #94a3b8; text-decoration: none; font-size: 14px; }
        
        #startOverlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.8);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10;
        }
        .start-btn {
            padding: 15px 40px;
            font-size: 20px;
            background: #38bdf8;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: bold;
        }
        .start-btn:hover { background: #0ea5e9; }
    </style>
</head>
<body>
    <div class="info">
        <h1>Snake</h1>
        <div class="score">Score: <span id="scoreVal">0</span></div>
    </div>
    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="startOverlay">
            <button class="start-btn" onclick="startGame()">Game Start</button>
        </div>
    </div>
    <a href="/" class="back">← Back to Lobby</a>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('scoreVal');
        const startOverlay = document.getElementById('startOverlay');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let score = 0;
        let dx = 0;
        let dy = 0;
        let snake = [{x: 10, y: 10}];
        let food = {x: 5, y: 5};
        let gameActive = false;
        let gameInterval = null;

        function startGame() {
            resetGame();
            gameActive = true;
            startOverlay.style.display = 'none';
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(drawGame, 100);
        }

        function drawGame() {
            if (gameActive) {
                update();
                if (checkGameOver()) {
                    gameActive = false;
                    clearInterval(gameInterval);
                    setTimeout(() => {
                        alert("Game Over! Score: " + score);
                        startOverlay.style.display = 'flex';
                    }, 10);
                    return;
                }
            }
            clearCanvas();
            drawFood();
            drawSnake();
        }

        function update() {
            if (dx === 0 && dy === 0) return;
            
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function checkGameOver() {
            if (dx === 0 && dy === 0) return false;
            
            const head = snake[0];
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) return true;
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) return true;
            }
            return false;
        }
        function clearCanvas() {
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawFood() {
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        function drawSnake() {
            ctx.fillStyle = '#38bdf8';
            snake.forEach(part => {
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function generateFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
        }

        function resetGame() {
            score = 0;
            scoreElement.innerText = score;
            snake = [{x: 10, y: 10}];
            dx = 0; dy = 0;
        }

        window.addEventListener('keydown', e => {
            switch(e.key) {
                case 'ArrowUp': if (dy !== 1) { dx = 0; dy = -1; } break;
                case 'ArrowDown': if (dy !== -1) { dx = 0; dy = 1; } break;
                case 'ArrowLeft': if (dx !== 1) { dx = -1; dy = 0; } break;
                case 'ArrowRight': if (dx !== -1) { dx = 1; dy = 0; } break;
            }
        });

        drawGame(); // Initial draw
