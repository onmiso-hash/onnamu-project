<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>onnamu.kr | 휴양림 빈자리</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='tokens.css') }}">
    <script>
        (function () {
            try {
                var v = localStorage.getItem('onnamu-theme');
                if (v === 'light' || v === 'dark') document.documentElement.setAttribute('data-theme', v);
            } catch (e) { }
        })();
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', -apple-system, sans-serif;
            background: linear-gradient(135deg, var(--bg-soft) 0%, var(--bg) 100%);
            color: var(--fg); min-height: 100vh; padding: 40px 20px; line-height: 1.6;
        }
        .container { max-width: var(--maxw); margin: 0 auto; }
        .glass-card {
            background: var(--bg-card); backdrop-filter: blur(12px);
            border-radius: var(--radius-xl); padding: 20px; border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 6px; }
        .top h1 { font-size: 1.5rem; font-weight: 800; }
        .top .when { font-size: 0.8rem; color: var(--fg-soft); }
        .back { margin-left: auto; font-size: 0.8rem; color: var(--accent); text-decoration: none; }
        .note { font-size: 0.78rem; color: var(--fg-faint); margin-bottom: 18px; }

        .section-label {
            font-size: 0.7rem; font-weight: 700; color: var(--fg-soft);
            text-transform: uppercase; letter-spacing: 2px; margin: 20px 0 10px 4px;
        }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip {
            border: 1px solid var(--border); background: var(--bg-sunken); color: var(--fg-muted);
            border-radius: 999px; padding: 6px 14px; font-size: 0.82rem;
            cursor: pointer; transition: all .15s; font-family: inherit;
        }
        .chip:hover { background: var(--bg-elev); }
        .chip.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); font-weight: 700; }

        .summary { margin: 24px 0 10px; font-size: 0.85rem; color: var(--fg-soft); }
        .summary b { color: var(--fg); font-size: 1.05rem; }

        .daygroup { margin-bottom: 24px; }
        .dayhead {
            display: flex; align-items: baseline; gap: 10px;
            font-weight: 800; font-size: 1.05rem; margin: 0 0 10px 4px;
        }
        .dayhead .dow { font-size: 0.8rem; color: var(--fg-soft); font-weight: 600; }
        .dayhead .cnt { margin-left: auto; font-size: 0.78rem; color: var(--fg-faint); font-weight: 600; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
        .item { padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; }
        .ihead { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
        .ihead .nm { font-weight: 700; font-size: 1rem; }
        .ihead .rooms { margin-left: auto; font-size: 0.75rem; color: var(--accent); font-weight: 700; }
        .isub { font-size: 0.76rem; color: var(--fg-soft); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .badge { font-size: 0.66rem; font-weight: 800; padding: 1px 7px; border-radius: 6px; }
        .b-국립 { background: var(--accent-soft); color: var(--accent); }
        .b-공립 { background: rgba(56, 189, 248, .16); color: #38bdf8; }
        .b-사립 { background: rgba(251, 191, 36, .16); color: #fbbf24; }
        .b-숙박 { background: rgba(52, 211, 153, .16); color: #34d399; }
        .b-야영 { background: rgba(244, 114, 182, .16); color: #f472b6; }

        .units { border-top: 1px solid var(--border); padding-top: 8px; display: flex; flex-direction: column; gap: 7px; }
        .ucat { font-size: 0.72rem; font-weight: 800; color: var(--fg-soft); letter-spacing: .5px; }
        .urow { display: flex; gap: 8px; align-items: baseline; font-size: 0.8rem; padding-left: 2px; }
        .urow .un { font-weight: 600; }
        .urow .us { color: var(--fg-faint); font-size: 0.74rem; }
        .urow .up { margin-left: auto; color: var(--fg-muted); font-size: 0.76rem; white-space: nowrap; }
        .nounit { font-size: 0.76rem; color: var(--fg-faint); border-top: 1px solid var(--border); padding-top: 8px; }
        .addr { font-size: 0.72rem; color: var(--fg-faint); }

        .empty { padding: 40px 20px; text-align: center; color: var(--fg-soft); }
        .empty b { display: block; font-size: 1.05rem; color: var(--fg); margin-bottom: 6px; }
        .go {
            display: inline-block; margin-top: 20px; padding: 10px 18px; border-radius: var(--radius);
            background: var(--accent); color: var(--on-accent); text-decoration: none;
            font-weight: 700; font-size: 0.85rem;
        }

        /* 날짜 띠 — 하나만 고른다. */
        .datestrip { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; scrollbar-width: thin; }
        .dchip {
            flex: 0 0 auto; min-width: 74px; text-align: center; cursor: pointer;
            border: 1px solid var(--border); background: var(--bg-sunken);
            border-radius: var(--radius); padding: 8px 12px; font-family: inherit;
            color: var(--fg-muted); transition: all .15s;
        }
        .dchip:hover { background: var(--bg-elev); }
        .dchip.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
        .dchip .dd { font-size: 0.95rem; font-weight: 800; display: block; }
        .dchip .dw { font-size: 0.68rem; opacity: .8; }
        .dchip .dn { font-size: 0.66rem; opacity: .7; display: block; margin-top: 2px; }

        /* 접힌 카드 */
        .item { cursor: pointer; }
        .item.open { border-color: var(--accent-line); }
        .pills { display: flex; flex-wrap: wrap; gap: 5px; }
        .pill {
            font-size: 0.7rem; padding: 2px 8px; border-radius: 999px;
            background: var(--bg-sunken); border: 1px solid var(--border); color: var(--fg-muted);
        }
        .more {
            display: block; width: 100%; margin: 14px 0 4px; padding: 11px;
            border: 1px dashed var(--accent-line); background: var(--bg-sunken);
            color: var(--accent); border-radius: var(--radius); font-weight: 700;
            font-size: 0.85rem; cursor: pointer; font-family: inherit;
        }
        .more:hover { background: var(--bg-elev); }
        .hint { font-size: 0.72rem; color: var(--fg-faint); margin-left: 4px; }
        .fail { margin-top: 20px; font-size: 0.78rem; color: var(--fg-faint); }
    </style>
</head>
<body>
<div class="container">
    <div class="top">
        <h1>🌲 휴양림 빈자리</h1>
        <span class="when" id="when">불러오는 중…</span>
        <a class="back" href="/">← 홈으로</a>
    </div>
    <p class="note">
        숲나들e에서 하루 한 번 모아 둔 것입니다. 실시간이 아니므로 들어가 보면 이미 나갔을 수 있습니다.
        예약은 숲나들e에서 직접 하십시오.
    </p>

    <div class="section-label">갈래</div>
    <div class="chips" id="kindChips"></div>

    <div class="section-label">종류</div>
    <div class="chips" id="catChips"></div>

    <div class="section-label">지역</div>
    <div class="chips" id="regionChips"></div>

    <div class="section-label">날짜 <span class="hint">하루씩 봅니다</span></div>
    <div class="datestrip" id="dateStrip"></div>

    <div class="summary" id="summary"></div>
    <div id="list"></div>
    <div class="fail" id="fail"></div>

    <a class="go" href="https://www.foresttrip.go.kr/rep/or/fcfsRsrvtMain.do?hmpgId=FRIP&menuId=001001"
       target="_blank" rel="noopener">숲나들e에서 예약하기 →</a>
</div>

<script>
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const PAGE = 60;                 // 한 번에 그리는 카드 수
let DATA = null;
let shown = PAGE;                // 지금 몇 개까지 그렸나
/* 날짜는 하루씩만 본다. 열세 밤을 한꺼번에 그리면 카드가 천 장을 넘는다. */
let pickedDate = null;
const pick = { kind: new Set(), category: new Set(), region: new Set() };

const fmtDate = iso => {
    const d = new Date(iso + 'T00:00:00');
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일';
};
const dow = iso => DOW[new Date(iso + 'T00:00:00').getDay()];

function chip(label, key, value, box) {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = label;
    b.onclick = () => {
        pick[key].has(value) ? pick[key].delete(value) : pick[key].add(value);
        b.classList.toggle('on');
        shown = PAGE;
        render();
    };
    box.appendChild(b);
}

function buildDateStrip() {
    const box = document.getElementById('dateStrip');
    const counts = {};
    (DATA.records || []).forEach(r => { counts[r.date] = (counts[r.date] || 0) + 1; });
    const dates = Object.keys(counts).sort();
    const today = new Date().toISOString().slice(0, 10);
    pickedDate = dates.find(d => d >= today) || dates[0];

    dates.forEach(d => {
        const b = document.createElement('button');
        b.className = 'dchip' + (d === pickedDate ? ' on' : '');
        b.innerHTML = '<span class="dd">' + fmtDate(d) + '</span>' +
            '<span class="dw">' + dow(d) + '요일 밤</span>' +
            '<span class="dn">' + counts[d] + '곳</span>';
        b.onclick = () => {
            pickedDate = d;
            shown = PAGE;
            box.querySelectorAll('.dchip').forEach(x => x.classList.remove('on'));
            b.classList.add('on');
            render();
        };
        box.appendChild(b);
    });
}

function buildFilters() {
    const recs = DATA.records || [];
    const add = (vals, key, box, fmt) =>
        vals.forEach(v => chip(fmt ? fmt(v) : v, key, v, document.getElementById(box)));
    add([...new Set(recs.map(r => r.kind).filter(Boolean))], 'kind', 'kindChips');
    const cats = [...new Set(recs.flatMap(r => (r.units || []).map(u => u.category)).filter(Boolean))].sort();
    add(cats, 'category', 'catChips');
    add([...new Set(recs.map(r => r.region))].sort(), 'region', 'regionChips',
        v => DATA.regions[v] || v);
    buildDateStrip();
}

/* 종류를 고르면 그 종류의 물건만 남기고, 하나도 안 남는 휴양림은 뺀다. */
function applyFilters() {
    const out = [];
    (DATA.records || []).forEach(r => {
        if (pickedDate && r.date !== pickedDate) return;
        if (pick.kind.size && !pick.kind.has(r.kind)) return;
        if (pick.region.size && !pick.region.has(r.region)) return;
        let units = r.units || [];
        if (pick.category.size) {
            units = units.filter(u => pick.category.has(u.category));
            if (units.length === 0) return;
        }
        out.push(Object.assign({}, r, { units: units }));
    });
    out.sort((a, b) =>
        (a.region_name || '').localeCompare(b.region_name || '') ||
        (a.name || '').localeCompare(b.name || ''));
    return out;
}

function unitList(r) {
    const box = document.createElement('div');
    box.className = 'units';
    box.hidden = true;
    const by = {};
    r.units.forEach(u => { (by[u.category || '기타'] = by[u.category || '기타'] || []).push(u); });
    Object.keys(by).sort().forEach(cat => {
        const h = document.createElement('div');
        h.className = 'ucat'; h.textContent = cat + ' ' + by[cat].length + '개';
        box.appendChild(h);
        by[cat].forEach(u => {
            const row = document.createElement('div');
            row.className = 'urow';
            const n = document.createElement('span');
            n.className = 'un'; n.textContent = u.name;
            const sp = document.createElement('span');
            sp.className = 'us'; sp.textContent = u.spec || '';
            const pr = document.createElement('span');
            pr.className = 'up'; pr.textContent = u.price || '';
            row.appendChild(n); row.appendChild(sp); row.appendChild(pr);
            box.appendChild(row);
        });
    });
    if (r.units_truncated) {
        const t = document.createElement('div');
        t.className = 'us'; t.textContent = '※ 너무 많아 일부만 담았습니다.';
        box.appendChild(t);
    }
    if (r.address) {
        const a = document.createElement('div');
        a.className = 'addr'; a.textContent = r.address;
        box.appendChild(a);
    }
    return box;
}

function card(r) {
    const c = document.createElement('div');
    c.className = 'glass-card item';

    const head = document.createElement('div');
    head.className = 'ihead';
    const nm = document.createElement('span');
    nm.className = 'nm'; nm.textContent = r.name || r.full;
    head.appendChild(nm);
    if (r.rooms != null) {
        const rm = document.createElement('span');
        rm.className = 'rooms'; rm.textContent = '남은 ' + r.rooms + '개';
        head.appendChild(rm);
    }
    c.appendChild(head);

    const sub = document.createElement('div');
    sub.className = 'isub';
    [[r.tier, 'b-' + r.tier], [r.kind, 'b-' + r.kind]].forEach(([t, cls]) => {
        if (!t) return;
        const sp = document.createElement('span');
        sp.className = 'badge ' + cls; sp.textContent = t;
        sub.appendChild(sp);
    });
    const loc = document.createElement('span');
    loc.textContent = [r.region_name, r.city].filter(Boolean).join(' · ');
    sub.appendChild(loc);
    if (r.homepage) {
        const a = document.createElement('a');
        a.href = r.homepage; a.target = '_blank'; a.rel = 'noopener';
        a.textContent = '홈페이지'; a.style.color = 'var(--accent)';
        a.onclick = e => e.stopPropagation();
        sub.appendChild(a);
    }
    c.appendChild(sub);

    if ((r.units || []).length) {
        /* 물건은 접어 둔다. 종류와 개수만 알약으로 보이고, 누르면 펼쳐진다. */
        const by = {};
        r.units.forEach(u => { by[u.category || '기타'] = (by[u.category || '기타'] || 0) + 1; });
        const pills = document.createElement('div');
        pills.className = 'pills';
        Object.keys(by).sort().forEach(k => {
            const sp = document.createElement('span');
            sp.className = 'pill'; sp.textContent = k + ' ' + by[k];
            pills.appendChild(sp);
        });
        c.appendChild(pills);

        const box = unitList(r);
        c.appendChild(box);
        c.onclick = () => {
            box.hidden = !box.hidden;
            c.classList.toggle('open', !box.hidden);
        };
    } else {
        const n = document.createElement('div');
        n.className = 'nounit';
        n.textContent = '종류별 목록은 이 지역에서 모으지 않습니다. 숲나들e에서 확인하십시오.';
        c.appendChild(n);
        c.style.cursor = 'default';
    }
    return c;
}

function render() {
    const recs = applyFilters();
    const units = recs.reduce((n, r) => n + (r.units || []).length, 0);
    document.getElementById('summary').innerHTML =
        (pickedDate ? fmtDate(pickedDate) + '(' + dow(pickedDate) + ') 밤 · ' : '') +
        '휴양림 <b>' + recs.length + '</b>곳 · 빈 물건 <b>' + units + '</b>개';

    const list = document.getElementById('list');
    list.innerHTML = '';
    if (!recs.length) {
        list.innerHTML = '<div class="glass-card empty"><b>조건에 맞는 빈자리가 없습니다.</b>' +
            '다른 날짜를 골라 보십시오.</div>';
        return;
    }

    const grid = document.createElement('div');
    grid.className = 'grid';
    recs.slice(0, shown).forEach(r => grid.appendChild(card(r)));
    list.appendChild(grid);

    if (recs.length > shown) {
        const b = document.createElement('button');
        b.className = 'more';
        b.textContent = '더 보기 (' + (recs.length - shown) + '곳 남음)';
        b.onclick = () => { shown += PAGE; render(); };
        list.appendChild(b);
    }
}

fetch('/api/huyang')
    .then(r => r.json())
    .then(d => {
        DATA = d;
        if (!d.records || !d.records.length) {
            document.getElementById('when').textContent = '아직 모은 것이 없습니다';
            document.getElementById('list').innerHTML =
                '<div class="glass-card empty"><b>아직 모은 것이 없습니다.</b>' +
                '새벽에 한 번 모읍니다. 그 뒤에 다시 열어 주십시오.</div>';
            return;
        }
        const w = new Date(d.collected_at);
        document.getElementById('when').textContent =
            '모은 때 ' + (w.getMonth() + 1) + '월 ' + w.getDate() + '일 ' +
            String(w.getHours()).padStart(2, '0') + ':' + String(w.getMinutes()).padStart(2, '0');
        buildFilters();
        render();
        if (d.failures && d.failures.length) {
            document.getElementById('fail').textContent =
                '모으는 중 ' + d.failures.length + '건은 실패했습니다. 그만큼은 빠져 있습니다.';
        }
    })
    .catch(() => { document.getElementById('when').textContent = '불러오지 못했습니다'; });
</script>
</body>
</html>
