<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>onnamu.kr | 로그인</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='tokens.css') }}">
    <!-- 대문에서 고른 밝게/어둡게를 이 화면도 그대로 따른다. 화면이 그려지기
         전에 돌아야 번쩍임이 없다. 이 화면에는 단추가 없다 — 물려받을 단추
         클래스가 .btn-submit(화면 폭을 다 쓰는 로그인 단추)뿐이라, 여기에
         단추를 놓으면 크기를 새로 정할 수밖에 없기 때문이다. -->
    <script>
        (function () {
            try {
                var v = localStorage.getItem('onnamu-theme');
                if (v === 'light' || v === 'dark') document.documentElement.setAttribute('data-theme', v);
            } catch (e) { }
        })();
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', -apple-system, sans-serif;
            background: linear-gradient(135deg, var(--bg-soft) 0%, var(--bg) 100%);
            color: var(--fg); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .login-card {
            background: var(--bg-card); backdrop-filter: blur(16px);
            border-radius: var(--radius-2xl); padding: 40px 30px; border: 1px solid var(--border);
            box-shadow: var(--shadow-lg); width: 100%; max-width: var(--maxw-card);
            text-align: center;
        }
        h2 { font-weight: 700; color: var(--fg); margin-bottom: 8px; font-size: 1.6rem; letter-spacing: -0.5px; }
        p.subtitle { font-size: 0.85rem; color: var(--fg-soft); margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--fg-soft); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; margin-left: 4px; }
        .input-group input {
            width: 100%; padding: 14px 16px; border-radius: var(--radius-lg); border: 1px solid var(--border);
            background: var(--bg-sunken); color: var(--fg); font-size: 0.95rem; outline: none; transition: all 0.2s;
        }
        .input-group input:focus { border-color: var(--accent); background: var(--bg-field); box-shadow: 0 0 10px var(--accent-ring); }
        .btn-submit {
            width: 100%; padding: 14px; border-radius: var(--radius-lg); border: none; background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%);
            color: var(--on-accent); font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.2s; margin-top: 10px;
            box-shadow: 0 4px 15px var(--accent-shadow);
        }
        .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 6px 20px var(--accent-shadow-lg); }
        .btn-submit:active { transform: translateY(1px); }
        .error-msg { background: var(--danger-soft); border: 1px solid var(--danger-line); color: var(--danger); font-size: 0.85rem; padding: 10px 14px; border-radius: var(--radius-md); margin-bottom: 20px; text-align: left; display: flex; align-items: center; gap: 8px; }
        footer { margin-top: 30px; font-size: 0.75rem; color: var(--fg-faint); }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>onnamu SSO Login</h2>
        <p class="subtitle">통합 로그인 세션에 로그인합니다.</p>

        {% if error %}
        <div class="error-msg">
            <span>⚠️</span>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="아이디를 입력하세요" required autocomplete="username">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-submit">로그인</button>
        </form>

        <footer>Managed by onmiso</footer>
    </div>
    {% include "_visit.html" %}
</body>
</html>
