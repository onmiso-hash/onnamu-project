services:
  portal:
    build: .
    container_name: my-portal
    ports:
      - "5001:5001"
    restart: always
    volumes:
      - "C:/:/host_c:ro"
      # 접속 기록 보관함 — 포털·도메인 조회·스튜디오가 같은 폴더에 쌓고,
      # 관리자 화면(접속자 지도)이 이 폴더를 읽는다.
      - "C:/Users/onmis/project/traffic:/traffic"
      - portal_news_data:/app/data   # 지수가 추가한 뉴스 데이터 영구 보관용 금고!
      - ./users.json:/app/users.json:ro
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - USERS_CONF_PATH=/app/users.json

# 파일 맨 밑에 아래 두 줄을 꼭 추가해 줘야 해! (네임드 볼륨 선언)
volumes:
  portal_news_data: