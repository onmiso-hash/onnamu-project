<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>RDAP Real-time Dashboard (5s)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .card { background: white; padding: 1.5rem; border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .refreshing { animation: pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #c7d2fe; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #818cf8; }

        /* 차트 영역 높이를 더 줄여서 여백 최적화 */
        .chart-container { position: relative; height: 250px; width: 100%; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-7xl mx-auto">
        <header class="mb-8 flex justify-between items-center">
            <div>
                <div class="flex items-center gap-3">
                    <h1 class="text-3xl font-bold text-gray-800">📊 RDAP Stats <span class="text-sm font-normal text-rose-500">(v00:26)</span></h1>
                    <span class="bg-green-100 text-green-700 text-xs px-2 py-1 rounded-full font-bold animate-pulse">LIVE (5s)</span>
                </div>
                <p id="update-time" class="text-sm text-gray-500 mt-1 font-mono">준비 중...</p>
            </div>
            <div class="text-right">
                <p class="text-xs text-gray-400 mb-1">자동 갱신 활성화됨</p>
                <button onclick="location.reload()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg hover:bg-emerald-700 transition font-medium text-sm">
                    즉시 수동 갱신
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="card border-l-4 border-emerald-500">
                <p class="text-xs text-gray-500 uppercase font-bold tracking-wider">Total Hits</p>
                <p id="total-hits" class="text-3xl font-bold text-gray-800">0</p>
            </div>
            <div class="card border-l-4 border-rose-500">
                <p class="text-xs text-gray-500 uppercase font-bold tracking-wider">Total Misses</p>
                <p id="total-misses" class="text-3xl font-bold text-gray-800">0</p>
            </div>
            <div class="card border-l-4 border-green-600">
                <p class="text-xs text-gray-500 uppercase font-bold tracking-wider">Success Rate</p>
                <p id="success-rate" class="text-3xl font-bold text-gray-800">0%</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
            <div class="card flex flex-col h-[300px]">
                <h2 class="text-lg font-bold mb-2 text-gray-700">Hits by Category</h2>
                <div class="flex-1 relative w-full h-full">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
            <div class="card flex flex-col h-[300px]">
                <h2 class="text-lg font-bold mb-2 text-gray-700">Top Access Client IPs</h2>
                <div class="flex-1 flex items-center justify-center relative w-full h-full">
                    <!-- 원 그래프가 절대 이 크기를 넘지 못하도록 고정 박스 생성 및 캔버스 자체 크기 제한 -->
                    <div style="position: relative; width: 100%; max-width: 210px; height: 210px; display: flex; justify-content: center; align-items: center;">
                        <canvas id="clientChart" style="max-height: 210px !important;"></canvas>
                    </div>
                </div>
            </div>
        </div>


        <div class="card overflow-x-auto mb-8">
            <h2 class="text-lg font-bold mb-4 text-gray-700">Bootstrap File Status</h2>
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 text-xs uppercase text-gray-500">
                        <th class="p-4 border-b">Resource</th>
                        <th class="p-4 border-b">Modified Date</th>
                        <th class="p-4 border-b">Published Date</th>
                    </tr>
                </thead>
                <tbody id="status-table-body" class="text-sm text-gray-700 font-mono"></tbody>
            </table>
        </div>

        <div class="card">
            <h2 class="text-lg font-bold mb-6 text-gray-700 flex items-center gap-2">
                🏆 Top 100 Rankings
                <span class="text-xs font-normal text-gray-400">(Real-time popularity)</span>
            </h2>
            <div id="top100-content" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>
    </div>

    <script>
        let categoryChart = null;
        let clientChart = null;

        function parseHits(descriptionArray) {
            if (!descriptionArray || descriptionArray.length === 0 || descriptionArray[0].includes("Zero queries.")) return 0;
            let total = 0;
            descriptionArray.forEach(item => {
                const parts = item.split('=');
                if(parts.length >= 2) {
                    const count = parseInt(parts[0].trim());
                    if(!isNaN(count)) total += count;
                }
            });
            return total;
        }

        async function initDashboard() {
            const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            const apiUrl = isLocal ? '/help' : 'https://bootstrap.rdap.kr/help';
            const updateLabel = document.getElementById('update-time');
            
            try {
                updateLabel.classList.add('refreshing'); 
                // 캐시 방지를 위해 타임스탬프 추가
                const response = await fetch(`${apiUrl}?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
                const data = await response.json();
                const notices = data.notices || [];

                const totalNotice = notices.find(n => n.title === "Totals");
                let hits = 0, misses = 0;
                if (totalNotice && totalNotice.description) {
                    totalNotice.description.forEach(item => {
                        if(item.toLowerCase().includes('hits')) hits = parseInt(item.split('=')[1]) || 0;
                        if(item.toLowerCase().includes('misses')) misses = parseInt(item.split('=')[1]) || 0;
                    });
                }
                document.getElementById('total-hits').innerText = hits.toLocaleString();
                document.getElementById('total-misses').innerText = misses.toLocaleString();
                const rate = (hits + misses) > 0 ? ((hits / (hits + misses)) * 100).toFixed(1) : 0;
                document.getElementById('success-rate').innerText = rate + '%';

                const categoryMapping = {
                    "Domain": ["Domain Hits", "DNS Hits"],
                    "IP": ["IP Hits", "IPv4 Hits", "IPv6 Hits"],
                    "Entity": ["Entity Hits", "Object Tags Hits"],
                    "Nameserver": ["Nameserver Hits"]
                };

                const categoryValues = Object.keys(categoryMapping).map(label => {
                    let sum = 0;
                    categoryMapping[label].forEach(title => {
                        const found = notices.find(n => n.title === title);
                        if(found) sum += parseHits(found.description);
                    });
                    return sum;
                });

                if (categoryChart) categoryChart.destroy(); 
                categoryChart = new Chart(document.getElementById('categoryChart'), {
                    type: 'bar',
                    data: {
                        labels: Object.keys(categoryMapping),
                        datasets: [{ label: 'Hits', data: categoryValues, backgroundColor: '#10b981', borderRadius: 6 }]
                    },
                    options: { 
                        responsive: true, 
                        maintainAspectRatio: false,
                        layout: { padding: { top: 10, bottom: 0 } },
                        plugins: { legend: { display: false } },
                        scales: { 
                            y: { beginAtZero: true, grid: { color: '#f3f4f6' }, ticks: { font: { size: 11 } } }, 
                            x: { grid: { display: false }, ticks: { font: { size: 11 }, padding: 0 } } 
                        }
                    }
                });

                const clientNotice = notices.find(n => n.title === "Access Client IP Hits");
                let clientLabels = ["No Data"], clientValues = [1];
                if (clientNotice && clientNotice.description && !clientNotice.description[0].includes("Zero queries.")) {
                    clientLabels = clientNotice.description.map(d => d.includes('=') ? d.split('=')[1].trim() : d);
                    clientValues = clientNotice.description.map(d => d.includes('=') ? parseInt(d.split('=')[0]) : 0);
                }

                if (clientChart) clientChart.destroy(); 
                clientChart = new Chart(document.getElementById('clientChart'), {
                    type: 'doughnut',
                    data: {
                        labels: clientLabels,
                        datasets: [{ data: clientValues, backgroundColor: ['#059669', '#10b981', '#34d399', '#6ee7b7', '#a7f3d0'], borderWidth: 0 }]
                    },
                    options: { 
                        responsive: true, 
                        maintainAspectRatio: true, 
                        cutout: '70%',
                        plugins: { 
                            legend: { 
                                position: 'bottom', 
                                labels: { boxWidth: 10, font: { size: 11 }, padding: 8 } 
                            } 
                        }
                    }
                });

                const tableBody = document.getElementById('status-table-body');
                tableBody.innerHTML = '';
                notices.filter(n => n.title.includes("Dates")).forEach(n => {
                    const modDate = n.description[0] || '-';
                    const pubDate = n.description[1] || '-';
                    let titleStr = n.title.replace(' Bootstrap File Modified and Published Dates', '').replace(' Bootstrap Dates', '');
                    tableBody.innerHTML += `
                        <tr class="border-b hover:bg-gray-50 transition">
                            <td class="p-4 font-semibold text-gray-800 text-xs">${titleStr}</td>
                            <td class="p-4 text-gray-500 text-[11px]">${modDate}</td>
                            <td class="p-4 text-gray-500 text-[11px]">${pubDate}</td>
                        </tr>
                    `;
                });

                const top100Container = document.getElementById('top100-content');
                top100Container.innerHTML = '';
                const top100Titles = ["Overall Top 100", "Domain Top 100", "Nameserver Top 100", "IP Address Top 100", "AS Number Top 100", "Entity Top 100"];
                top100Titles.forEach(title => {
                    const found = notices.find(n => n.title === title);
                    if (found) {
                        const section = document.createElement('div');
                        section.className = 'bg-gray-50 rounded-xl border border-gray-100 flex flex-col h-[400px] overflow-hidden';
                        let itemsHtml = (found.description && !found.description[0].includes("No data.")) 
                            ? found.description.map((item, idx) => {
                                const parts = item.split('=');
                                return `<div class="flex justify-between items-center text-[11px] py-2 px-3 border-b border-gray-100 last:border-0 hover:bg-white transition group">
                                    <div class="flex items-center gap-2 overflow-hidden">
                                        <span class="text-gray-400 font-mono w-5 flex-shrink-0">${idx + 1}.</span>
                                        <span class="font-medium text-gray-700 truncate group-hover:text-emerald-600" title="${parts.slice(1).join('=').trim()}">${parts.slice(1).join('=').trim()}</span>
                                    </div>
                                    <span class="bg-emerald-50 text-emerald-600 font-bold px-2 py-0.5 rounded-full text-[10px] flex-shrink-0">${parts[0].trim()}</span>
                                </div>`;
                            }).join('')
                            : `<div class="flex flex-col items-center justify-center h-full text-gray-400 py-10"><p class="text-xs italic">No query data yet</p></div>`;
                        section.innerHTML = `
                            <div class="p-3 bg-white border-b border-gray-100 flex justify-between items-center"><h3 class="text-xs font-bold text-gray-600 uppercase tracking-wider">${title.replace(' Top 100', '')}</h3><span class="text-[10px] font-bold text-emerald-400">Hits</span></div>
                            <div class="flex-1 overflow-y-auto custom-scrollbar bg-white/50">${itemsHtml}</div>`;
                        top100Container.appendChild(section);
                    }
                });

                updateLabel.innerText = "Last sync: " + new Date().toLocaleTimeString();
                updateLabel.classList.remove('refreshing');
            } catch (error) {
                updateLabel.innerHTML = `<span class="text-rose-500 font-bold">Sync Failed: ${new Date().toLocaleTimeString()}</span>`;
                updateLabel.classList.remove('refreshing');
            }
        }
        initDashboard();
        setInterval(initDashboard, 5000);
    </script>
</body>
</html>
